schema: mivr-e2e-spec/1
# Each case fetches the committed fixture over a local file:// URL through
# `pinned_download` with a different digest shape. Malformed shapes fail before
# any bytes move, with the helper's own message; the wrong digest fails on
# Bazel's checksum comparison; the correct digest succeeds. No network.
commands:
  - name: an empty digest fails the fetch
    run: bazel build @bad_empty//...
    expect:
      non_zero: true
      output_contains:
        - "pinned_download: refusing to fetch"
        - '"sha256" must be exactly 64 lowercase hex digits, got "".'
  - name: a short digest fails the fetch
    run: bazel build @bad_short//...
    expect:
      non_zero: true
      output_contains:
        - "pinned_download: refusing to fetch"
        - '"sha256" must be exactly 64 lowercase hex digits, got "86bea300d6701fb6c1fddc33b21235231d108b44a9793db9dcd48940fa46a6a".'
  - name: an uppercase digest fails the fetch
    run: bazel build @bad_upper//...
    expect:
      non_zero: true
      output_contains:
        - "pinned_download: refusing to fetch"
        - '"sha256" must be exactly 64 lowercase hex digits, got "86BEA300D6701FB6C1FDDC33B21235231D108B44A9793DB9DCD48940FA46A6A6".'
  - name: an SRI digest fails the fetch
    run: bazel build @bad_sri//...
    expect:
      non_zero: true
      output_contains:
        - "pinned_download: refusing to fetch"
        - '"sha256" must be exactly 64 lowercase hex digits, got "sha256-hr6jANZwH7bB/dwzshI1Ix0Qi0SpeT253NSJQPpGpqY=".'
  - name: a conditional blank digest fails the fetch
    run: bazel build @bad_conditional//...
    expect:
      non_zero: true
      output_contains:
        - "pinned_download: refusing to fetch"
        - '"sha256" must be exactly 64 lowercase hex digits, got "".'
  - name: a wrong digest fails on the checksum comparison
    run: bazel build @bad_wrong//...
    expect:
      non_zero: true
      output_contains:
        - Checksum was
        - but wanted 86bea300d6701fb6c1fddc33b21235231d108b44a9793db9dcd48940fa46a6a7
  - name: a correct digest on the same fixture succeeds
    run: bazel build @good//...
