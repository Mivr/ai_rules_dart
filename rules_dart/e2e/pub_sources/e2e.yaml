schema: mivr-e2e-spec/1
commands:
  - name: test
    run: bazel test --test_output=errors //...
    min_tests_executed: 1
  # A path package outside the module cannot be built: the extension says so,
  # naming the package.
  - name: path_outside_module
    run: bazel build //:sources_test
    replace_in_files:
      pubspec.lock:
        - find: 'path: "pkgs/greet"'
          replace: 'path: "../../outside_greet"'
    expect:
      non_zero: true
      output_contains:
        - 'pub package "greet" in @@//:pubspec.lock is a path dependency on "../../outside_greet", which is outside the module'
