name: app
description: A stock Dart package with json_serializable, freezed, drift and mockito, whose BUILD file Gazelle writes.
publish_to: none
environment:
  sdk: ^3.13.0
dependencies:
  drift: ^2.35.4
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.3
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mockito: ^5.8.1
  test: ^1.33.0
hooks:
  user_defines:
    # drift's sqlite3 compiles SQLite from source instead of downloading a
    # prebuilt library. The amalgamation is the BCR `sqlite3` module's
    # (`hook_data` in MODULE.bazel); the path is relative to this file.
    sqlite3:
      source: source
      path: ../external/sqlite3+/sqlite3.c
