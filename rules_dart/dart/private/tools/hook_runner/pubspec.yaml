# The packages of the hook runner rules_dart runs build and link hooks with
# (`//dart/private/tools/hook_runner`). Every version is the one the Flutter
# 3.47.7 tool pins (its workspace `pubspec.lock`), which is the version Dart
# 3.13.5's own `dart build` runs: the runner belongs to the SDK, not to the
# app. A hook's own `hooks` and `code_assets` come from the app's lock.
name: rules_dart_hook_runner
publish_to: none
environment:
  sdk: ^3.13.0
dependencies:
  args: 2.7.0
  async: 2.13.1
  code_assets: 1.2.1
  collection: 1.19.1
  crypto: 3.0.7
  data_assets: 0.20.0
  file: 7.0.1
  graphs: 2.3.2
  hooks: 2.0.2
  hooks_runner: 1.5.0
  logging: 1.3.0
  meta: 1.18.3
  package_config: 2.2.0
  path: 1.9.1
  pub_semver: 2.2.0
  record_use: 0.6.0
  source_span: 1.10.2
  string_scanner: 1.4.1
  term_glyph: 1.2.2
  typed_data: 1.4.0
  yaml: 3.1.3
