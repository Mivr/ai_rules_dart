name: rules_dart_ext
publish_to: none
description: >
  The pub packages rules_dart's own tools, tests and lints are built from (`@ext_pub_deps`), including package:hooks and package:data_assets for the `dart_link_hook` runner.

environment:
  sdk: ^3.12.0
dependencies:
  analyzer: ^14.5.0
  args: ^2.5.0
  crypto: ^3.0.0
  dart_style: ^3.1.14
  data_assets: ^0.20.0
  hooks: ^2.2.0
  package_config: ^3.0.0
  path: ^1.9.0
  sqlite3: ^3.7.1
dev_dependencies:
  test: ^1.25.0
