name: Perf Linux
on:
  workflow_dispatch:
    inputs:
      head_ref:
        description: "Git ref under measurement"
        required: true
        type: string
      target_loc:
        description: "Target lines of Dart code"
        required: false
        default: "500000"
        type: string
      repeats:
        description: "Number of measured repeats"
        required: false
        default: "3"
        type: string
      seed:
        description: "Deterministic random seed"
        required: false
        default: "1"
        type: string
      link_modules:
        description: "dart_binary link_modules arm: off, on, or ab (paired off/on)"
        required: false
        default: "off"
        type: choice
        options:
          - "off"
          - "on"
          - ab
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Resolve link_modules arms
        env:
          LINK_MODULES: ${{ inputs.link_modules }}
        run: |
          case "$LINK_MODULES" in
            off) arms="off" ;;
            on) arms="on" ;;
            ab) arms="off on" ;;
            *)
              echo "link_modules must be off, on or ab, got '$LINK_MODULES'" >&2
              exit 1
              ;;
          esac
          echo "ARMS=$arms" >> "$GITHUB_ENV"
      - name: Checkout bench tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: tools-src
      - name: Enable and verify Linux user namespaces
        run: tools-src/.github/scripts/enable_linux_sandbox.sh
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: false
          disk-cache: false
          external-cache: false
          repository-cache: false
          cache-save: false
      - name: Configure tooling Bazel version
        run: |
          if [ -f tools-src/.bazelversion ]; then
            cp tools-src/.bazelversion tools-src/tools/.bazelversion
          fi
      - name: Checkout rules under measurement
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.head_ref }}
          path: rules-head
          fetch-depth: 0
      - name: Generate pristine monorepo
        env:
          TARGET_LOC: ${{ inputs.target_loc }}
          SEED: ${{ inputs.seed }}
        run: |
          tooling_base="${RUNNER_TEMP}/tooling-outbase"
          for arm in $ARMS; do
            ws="${RUNNER_TEMP}/pristine-ws-$arm"
            mkdir -p "$ws"
            (cd tools-src/tools && bazel --max_idle_secs=60 --output_base="$tooling_base" run //perf:generate -- \
              --target-loc="$TARGET_LOC" \
              --seed="$SEED" \
              --link-modules="$arm" \
              --rules-dart="$GITHUB_WORKSPACE/rules-head" \
              --out="$ws")
          done
      - name: Commit lockfile via unmeasured analysis-only pass
        run: |
          cleanup_scratch() {
            (cd "$ws" && bazel --max_idle_secs=60 --output_base="$scratch_base" shutdown) || echo "bazel shutdown failed" >&2
            chmod -R u+w "$scratch_base" 2>/dev/null || echo "scratch cleanup chmod failed" >&2
            rm -rf "$scratch_base"
          }
          trap cleanup_scratch EXIT
          for arm in $ARMS; do
            ws="${RUNNER_TEMP}/pristine-ws-$arm"
            scratch_base="${RUNNER_TEMP}/scratch-outbase-$arm"
            leaf_tests=$(cd "$ws" && bazel --max_idle_secs=60 --output_base="$scratch_base" query 'kind(dart_test, //...)')
            test -n "$leaf_tests"
            # shellcheck disable=SC2086
            (cd "$ws" && bazel --max_idle_secs=60 --output_base="$scratch_base" build --nobuild --lockfile_mode=update //app:app $leaf_tests)
            cleanup_scratch
            test -f "$ws/MODULE.bazel.lock"
          done
          trap - EXIT
      - name: Run speed-of-light runner repeats
        env:
          REPEATS: ${{ inputs.repeats }}
        run: |
          tooling_base="${RUNNER_TEMP}/tooling-outbase"
          case "$REPEATS" in
            '' | *[!0-9]* | 0*)
              echo "repeats must be a positive integer >= 1, got '$REPEATS'" >&2
              exit 1
              ;;
          esac
          failed=0
          read -ra arms <<< "$ARMS"
          for i in $(seq 1 "$REPEATS"); do
            # Odd repeats run the arms in order, even repeats in reverse, so
            # neither arm always runs first on the runner.
            order=("${arms[@]}")
            if [ $((i % 2)) -eq 0 ]; then
              order=()
              for ((k = ${#arms[@]} - 1; k >= 0; k--)); do order+=("${arms[k]}"); done
            fi
            for arm in "${order[@]}"; do
              mkdir -p "${RUNNER_TEMP}/bench-results-$arm"
              (cd tools-src/tools && bazel --max_idle_secs=60 --output_base="$tooling_base" run //perf:runner -- \
                --workspace="${RUNNER_TEMP}/pristine-ws-$arm" \
                --repeat="$i" \
                --repeats="$REPEATS" \
                --out="${RUNNER_TEMP}/bench-results-$arm/repeat-$i.json") || failed=1
            done
          done
          exit "$failed"
      - name: Summarize speed-of-light results
        if: ${{ !cancelled() }}
        env:
          HEAD_REF: ${{ inputs.head_ref }}
          TARGET_LOC: ${{ inputs.target_loc }}
          SEED: ${{ inputs.seed }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          tooling_base="${RUNNER_TEMP}/tooling-outbase"
          case "$REPEATS" in
            '' | *[!0-9]* | 0*)
              echo "repeats must be a positive integer >= 1, got '$REPEATS'" >&2
              exit 1
              ;;
          esac
          if ! sha="$(git -C "$GITHUB_WORKSPACE/rules-head" rev-parse HEAD 2>/dev/null)"; then
            sha="$HEAD_REF"
          fi
          # One arm keeps dart-sol.json; an A/B run writes one file per arm and
          # a paired report.
          ab_args=()
          if [ "$ARMS" = "off on" ]; then
            results="${RUNNER_TEMP}/bench-results-off"
            out="$GITHUB_WORKSPACE/dart-sol-off.json"
            ab_args=(--on-results-dir="${RUNNER_TEMP}/bench-results-on" --on-out="$GITHUB_WORKSPACE/dart-sol-on.json" --ab-report="$GITHUB_WORKSPACE/dart-sol-ab.md")
          else
            results="${RUNNER_TEMP}/bench-results-$ARMS"
            out="$GITHUB_WORKSPACE/dart-sol.json"
          fi
          mkdir -p "$results"
          summary_rc=0
          (cd tools-src/tools && bazel --max_idle_secs=60 --output_base="$tooling_base" run //perf:summarize -- \
            --results-dir="$results" \
            --sha="$sha" \
            --target-loc="$TARGET_LOC" \
            --seed="$SEED" \
            --repeats="$REPEATS" \
            --out="$out" \
            "${ab_args[@]}") || summary_rc=$?
          for f in dart-sol-ab.md dart-sol.json dart-sol-off.json dart-sol-on.json; do
            if [ -f "$GITHUB_WORKSPACE/$f" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              cat "$GITHUB_WORKSPACE/$f" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit "$summary_rc"
      - name: Shut down tooling Bazel server
        if: ${{ always() }}
        run: |
          tooling_base="${RUNNER_TEMP}/tooling-outbase"
          if [ -d tools-src/tools ]; then
            (cd tools-src/tools && bazel --max_idle_secs=60 --output_base="$tooling_base" shutdown) || echo "bazel shutdown failed" >&2
          fi
      - name: Upload dart-sol artifact
        if: ${{ !cancelled() && inputs.head_ref != '' && inputs.link_modules != 'ab' }}
        uses: actions/upload-artifact@v7
        with:
          name: dart-sol
          path: dart-sol.json
          retention-days: 3
      - name: Upload dart-sol-off artifact
        if: ${{ !cancelled() && inputs.head_ref != '' && inputs.link_modules == 'ab' }}
        uses: actions/upload-artifact@v7
        with:
          name: dart-sol-off
          path: dart-sol-off.json
          retention-days: 3
      - name: Upload dart-sol-on artifact
        if: ${{ !cancelled() && inputs.head_ref != '' && inputs.link_modules == 'ab' }}
        uses: actions/upload-artifact@v7
        with:
          name: dart-sol-on
          path: dart-sol-on.json
          retention-days: 3
