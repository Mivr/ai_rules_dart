# See CONTRIBUTING.md for instructions.
# Hooks run with prek (https://github.com/j178/prek), which reads this
# pre-commit format. See https://pre-commit.com/hooks.html for more hooks
# The commit message check runs in commit-msg stage
# but we don't want to run the other hooks on commit messages
default_stages: [pre-commit]
# One `prek install` sets up both stages
default_install_hook_types: [pre-commit, commit-msg]
# Use a slightly older version of node by default
# as the default uses a very new version of GLIBC
default_language_version:
  node: 16.18.0
repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-private-key
      # Vendored third-party code, kept byte-for-byte as the SDK ships it.
      # The git bundle below is a binary fixture: rewriting its bytes would
      # corrupt it.
      - id: end-of-file-fixer
        exclude: ^third_party/dart_linter/|^e2e/pub_lock_git/fmtpkg\.bundle$
      - id: trailing-whitespace
        exclude: ^third_party/dart_linter/|^e2e/pub_lock_git/fmtpkg\.bundle$
  # Check formatting and lint for starlark code
  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 10.1.0
    hooks:
      - id: buildifier
      - id: buildifier-lint
  # Lint the GitHub workflows with a pinned actionlint release. The hook
  # downloads the platform's archive from that release only when the cache
  # is empty, verifies its sha256 against the pinned checksum below (an
  # unknown platform or a missing checksum fails closed), then lints every
  # workflow file, so an invalid workflow fails pre-commit. Bump the
  # version, asset names and checksums together from the release's
  # actionlint_<version>_checksums.txt.
  - repo: local
    hooks:
      - id: actionlint
        name: actionlint workflows
        entry: |-
          bash -c '
          set -eu
          version=1.7.12
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          os="$(uname -s)"
          arch="$(uname -m)"
          case "${os}/${arch}" in
            Linux/x86_64) asset="actionlint_${version}_linux_amd64.tar.gz"; want=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 ;;
            Linux/aarch64|Linux/arm64) asset="actionlint_${version}_linux_arm64.tar.gz"; want=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6 ;;
            Darwin/x86_64) asset="actionlint_${version}_darwin_amd64.tar.gz"; want=5b44c3bc2255115c9b69e30efc0fecdf498fdb63c5d58e17084fd5f16324c644 ;;
            Darwin/arm64|Darwin/aarch64) asset="actionlint_${version}_darwin_arm64.tar.gz"; want=aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f ;;
            MINGW*/x86_64|MSYS*/x86_64|CYGWIN*/x86_64) asset="actionlint_${version}_windows_amd64.zip"; want=6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9 ;;
            MINGW*/aarch64|MINGW*/arm64|MSYS*/aarch64|MSYS*/arm64|CYGWIN*/aarch64|CYGWIN*/arm64) asset="actionlint_${version}_windows_arm64.zip"; want=cadcf7ea4efe3a68728893813643cebe1185e5b1d4be5b96245f65c9a4d5ea41 ;;
            *) echo "actionlint hook: unsupported platform ${os}/${arch}" >&2; exit 1 ;;
          esac
          : "${want:?actionlint hook: no pinned checksum for this platform}"
          command -v curl >/dev/null || { echo "actionlint hook: curl is required" >&2; exit 1; }
          if command -v sha256sum >/dev/null; then sum="sha256sum"; elif command -v shasum >/dev/null; then sum="shasum -a 256"; else echo "actionlint hook: sha256sum or shasum is required" >&2; exit 1; fi
          dir="${XDG_CACHE_HOME:-$HOME/.cache}/rules-dart-actionlint-${version}"
          mkdir -p "${dir}"
          archive="${dir}/${asset}"
          bin="${dir}/actionlint"
          case "${os}" in MINGW*|MSYS*|CYGWIN*) bin="${bin}.exe" ;; esac
          if [ ! -f "${archive}" ]; then curl -fsSL -o "${archive}" "${base}/${asset}"; fi
          printf "%s  %s\n" "${want}" "${archive}" | ${sum} -c -
          if [ ! -x "${bin}" ]; then
            case "${archive}" in
              *.zip) command -v unzip >/dev/null || { echo "actionlint hook: unzip is required" >&2; exit 1; }; unzip -o -d "${dir}" "${archive}" ;;
              *.tar.gz) tar -xzf "${archive}" -C "${dir}" ;;
            esac
          fi
          "${bin}" .github/workflows/*.yaml
          ' _
        language: system
        files: ^\.github/workflows/[^/]+\.ya?ml$
        pass_filenames: false
  # Enforce the commit message policy in AGENTS.md: a conventional-commit
  # subject and the `Changelog:` trailer rules
  - repo: local
    hooks:
      - id: commit-message
        name: commit message policy
        entry: bash -c 'cd tools && exec bazel run --ui_event_filters=-info --noshow_progress --show_result=0 //changelog:check -- "$@"' _
        language: system
        stages: [commit-msg]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        exclude: ^third_party/dart_linter/
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
        exclude: ^third_party/dart_linter/
