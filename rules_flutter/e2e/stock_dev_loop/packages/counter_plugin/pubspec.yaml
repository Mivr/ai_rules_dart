name: counter_plugin
description: "A plugin with Dart code only: its Dart class registers before main()."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        dartPluginClass: CounterPlugin
      linux:
        dartPluginClass: CounterPlugin
