# The project of `//:app_dev_boot`: the root package's app with a
# `web/flutter_bootstrap.js` of its own. A directory of its own because the
# root's `web/` feeds every Tier 1 target there, so a bootstrap in it would
# silently become the bootstrap of all of them. It names the root's asset, a
# copy of which sits beside it: a project's assets live under its directory.
name: web_example
publish_to: none
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/message.txt
