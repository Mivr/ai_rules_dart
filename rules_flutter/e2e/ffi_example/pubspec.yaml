name: ffi_example
publish_to: none
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  # Third mechanism: a native library nothing here names. drift reaches
  # package:sqlite3, whose own `hook/build.dart` builds its native code; the
  # user define below has it compile SQLite from source. The app depends
  # only on drift.
  drift: ^2.32.0
dev_dependencies:
  very_good_analysis: ^10.3.0
flutter:
  uses-material-design: true
hooks:
  user_defines:
    sqlite3:
      # Compile SQLite from the amalgamation Bazel provides
      # (`flutter.pub(hook_data = ...)` in MODULE.bazel) instead of
      # downloading a prebuilt library, which a sandboxed hook may not do.
      source: source
      path: external/sqlite3+/sqlite3.c
