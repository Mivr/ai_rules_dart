schema: mivr-e2e-spec/1
commands:
  # Build first, and let Bazel's persistent workers (two JVMs of about 1.3 GB:
  # dex and R8) exit with the build. The tests then boot the emulator (qemu,
  # about 3 GB resident) without those JVMs and without bundles still building
  # beside it: on a 16 GB runner the two overlapped, used memory reached 15.5 GB
  # and one run in six of this workspace lost its runner at the first emulator
  # test, with no log.
  - name: build all targets, then release the workers
    run: bazel build //... --worker_quit_after_build
  - name: test all targets
    run: bazel test //... --test_output=errors
    min_tests_executed: 4
  - name: Android emulator passing driver
    run: bazel test //apps/sub:drive_pass_test --test_output=errors
    expect:
      exit_code: 0
      test_log_contains: DRIVE_PASS_OK
  - name: Android emulator failing driver
    run: bazel test //apps/sub:drive_fail_test --test_output=errors
    expect:
      non_zero: true
      output_contains: DRIVE_RED_MUST_FAIL
      test_log_contains: DRIVE_RED_MUST_FAIL
