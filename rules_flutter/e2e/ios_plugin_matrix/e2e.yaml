      output_contains: 'Flutter plugin "cloud_firestore" depends on pod "Firebase/Firestore" (12.19.3 in @@//:Podfile.lock), which no Bazel target provides. Map it with flutter.pub(ios_pod_deps = {"Firebase/Firestore": "<label>"})'
  - name: query pods firebase_messaging spoke
    run: bazel query @deps_pods__firebase_messaging//:all
    expect:
      non_zero: true
      output_contains: 'Flutter plugin "firebase_messaging" depends on pod "Firebase/Messaging" (12.19.3 in @@//:Podfile.lock), which no Bazel target provides. Map it with flutter.pub(ios_pod_deps = {"Firebase/Messaging": "<label>"})'
  - name: query pods google_maps_flutter_ios spoke
    run: bazel query @deps_pods__google_maps_flutter_ios//:all
    expect:
      non_zero: true
      output_contains: 'Flutter plugin "google_maps_flutter_ios" depends on pod "GoogleMaps" (10.15.0 in @@//:Podfile.lock), which no Bazel target provides. Map it with flutter.pub(ios_pod_deps = {"GoogleMaps": "<label>"})'
