  - name: the pods sentry_flutter iOS side is refused where an Apple build reaches it
    run: bazel build @deps_pods__sentry_flutter//:sentry_flutter_apple_ios_unbuildable
    expect:
      non_zero: true
      output_contains: 'sets no `swift_package_resolved`'
  - name: query pods image_picker_ios spoke
    run: bazel query @deps_pods__image_picker_ios//:all
  - name: query pods webview_flutter_wkwebview spoke
    run: bazel query @deps_pods__webview_flutter_wkwebview//:all
  - name: query pods url_launcher_ios spoke
    run: bazel query @deps_pods__url_launcher_ios//:all
  - name: query pods permission_handler_apple spoke
