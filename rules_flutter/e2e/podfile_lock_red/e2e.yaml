schema: mivr-e2e-spec/1
commands:
  - name: tab-indented Podfile.lock fails at hub evaluation
    run: bazel query @red_deps//...
    expect:
      non_zero: true
      output_contains:
        - "cannot read YAML: Error: bad file"
        - ":Podfile.lock': go-yaml load error in scanner"
        - "at L2.C1: found character that cannot start any token"
