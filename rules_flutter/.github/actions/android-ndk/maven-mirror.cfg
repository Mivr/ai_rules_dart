# Bazel downloader config for CI (`--downloader_config`): an address on Maven
# Central is tried as it is, and then at Google's mirror of Maven Central, the
# same order as `maven_urls` in flutter/private/android_model/maven.bzl uses for
# the artifacts of the Android pins. Two rewrite lines for one address give both
# addresses, in this order. Bazel checks every download against the sha256 its
# rule states; the mirror serves the bytes of Maven Central (checked for
# kotlin-build-tools-api-2.4.20.jar, 468126 bytes, sha256 47a622dc...fe459).
rewrite repo1.maven.org/maven2/(.*) repo1.maven.org/maven2/$1
rewrite repo1.maven.org/maven2/(.*) maven-central.storage-download.googleapis.com/maven2/$1
rewrite repo.maven.apache.org/maven2/(.*) repo.maven.apache.org/maven2/$1
rewrite repo.maven.apache.org/maven2/(.*) maven-central.storage-download.googleapis.com/maven2/$1
