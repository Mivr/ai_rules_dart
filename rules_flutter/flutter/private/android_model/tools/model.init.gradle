// The pin step of the Android model: Gradle describes, Bazel builds.
//
// Run by `bazel run //:android_pin` (see pin.dart) as
//   ./gradlew -I model.init.gradle :app:rdfAndroidModel --no-configuration-cache \
//       -Prdf.out=<file.json> [-Prdf.variants=debug,devDebug] [-Prdf.workspace=<dir>] [-Prdf.fallback=:a,:b]
// from <app>/android, after `flutter pub get`.
//
// It writes one JSON file (schema 3) that describes every Android project of the build (the app, each
// plugin's android/ project, library modules of the app) per variant, and the resolved Maven classpaths
// with the sha256 of every artifact. Nothing is built: the work is configuration and dependency
// resolution, plus the generator task of the google-services plugin when it is applied.
//
// The script uses what the build has loaded (AGP's variant API and DSL, the Kotlin plugin's compile
// task). The user applies no plugin and no Gradle file is read as text by anything but Gradle.

import groovy.json.JsonOutput
import java.security.MessageDigest

def rdfVariants = new java.util.concurrent.ConcurrentHashMap()   // project path -> [variant objects]

gradle.allprojects { p ->
  ['com.android.application', 'com.android.library'].each { pid ->
    p.pluginManager.withPlugin(pid) {
      def ac = p.extensions.getByName('androidComponents')
      ac.onVariants(ac.selector().all(), { v ->
        rdfVariants.computeIfAbsent(p.path, { new java.util.concurrent.CopyOnWriteArrayList() }).add(v)
      } as org.gradle.api.Action)
    }
  }
}

// versionCode and versionName: a Flutter app takes them from `flutter.versionCode` and
// `flutter.versionName`, which the Flutter tool derives from `version:` of pubspec.yaml and writes to
// local.properties when it builds. The model must not depend on what that file happens to hold, so
// Gradle evaluates the build with two markers instead; the rules put the pubspec's values in their
// place at build time. A build file that sets its own values is recorded as it is.
ext.rdfVersionCodeMarker = '1073741823'
ext.rdfVersionNameMarker = '@pubspec.version@'
gradle.allprojects { p ->
  p.pluginManager.withPlugin('dev.flutter.flutter-gradle-plugin') {
    def fx = p.extensions.findByName('flutter')
    if (fx != null && fx.hasProperty('flutterVersionCode')) {
      fx.flutterVersionCode = rdfVersionCodeMarker
      fx.flutterVersionName = rdfVersionNameMarker
    }
  }
}

gradle.projectsEvaluated { g ->
  def app = g.rootProject.allprojects.find { it.pluginManager.hasPlugin('com.android.application') }
  if (app == null) return
  app.tasks.register('rdfAndroidModel') { t ->
    t.group = 'rdf'
    t.notCompatibleWithConfigurationCache('reads the model of every project')
    // google-services generates resource values from google-services.json: its task runs here, once,
    // and what it wrote is recorded in the model.
    g.rootProject.allprojects.each { p ->
      p.tasks.matching { it.name ==~ /process.*GoogleServices/ }.each { gs -> t.dependsOn(gs) }
    }
    t.doLast { rdfWriteModel(g, app, rdfVariants) }
  }
}

// The escape hatch (see GradleAar.java): `rdfFallbackAar -Prdf.fallback.project=:name
// -Prdf.fallback.variant=debug -Prdf.fallback.out=<file>` builds one library project's AAR with Gradle
// and copies it out.
gradle.projectsEvaluated { g ->
  def path = g.rootProject.findProperty('rdf.fallback.project')
  // An init script runs in included builds too (the Flutter tool's Gradle plugin is one).
  if (path == null || g.parent != null) return
  def p = g.rootProject.findProject(path.toString())
  if (p == null) throw new GradleException("rdf: no project ${path} in this build")
  def variant = (g.rootProject.findProperty('rdf.fallback.variant') ?: 'debug').toString()
  def out = new File(g.rootProject.findProperty('rdf.fallback.out').toString())
  p.tasks.register('rdfFallbackAar') { t ->
    def bundle = p.tasks.named("bundle${variant.capitalize()}Aar")
    t.dependsOn(bundle)
    t.doLast { out.bytes = bundle.get().archiveFile.get().asFile.bytes }
  }
}

