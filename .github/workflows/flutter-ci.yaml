      # shipped in the release archive (including @rules_flutter//lint) loads
      # cleanly against the declared floor graph.
      - name: Release archive packages load against min_versions floor
        run: |
          archive_dir="$(mktemp -d)"
          trap '(cd e2e/min_versions 2>/dev/null && bazel shutdown) >/dev/null 2>&1 || true; rm -rf "$archive_dir"' EXIT
