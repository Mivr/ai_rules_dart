          rm -rf "$archive_dir"
          trap - EXIT
      - name: Report cache sizes
        if: always()
        run: du -sh ~/.cache/bazel-disk ~/.cache/bazel-repo 2>/dev/null || true
      - name: Save disk cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.uncached
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_SAVE_KEY }}
      # Each save gets its own key (run id and attempt), so a restore always
      # finds a complete entry: deleting the key before re-saving it left a
      # window in which concurrent runs restored nothing and built cold. Once
      # this run's entry exists, drop this shard's entries created before it on
      # this ref; a newer entry from a concurrent run is kept.
      - name: Prune older disk cache entries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.uncached
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
        run: |
          prefix="${DISK_CACHE_KEY%-*}-"
          list="repos/$REPO/actions/caches?per_page=100&key=$prefix"
          created=$(gh api "$list" --jq '.actions_caches[] | select(.key == env.DISK_CACHE_SAVE_KEY and .ref == env.REF) | .created_at')
          if [ -z "$created" ]; then
            echo "::warning::$DISK_CACHE_SAVE_KEY was not saved; keeping the older entries"
            exit 0
          fi
          ids=$(CREATED="$created" gh api "$list" --jq '.actions_caches[] | select(.key != env.DISK_CACHE_SAVE_KEY and .ref == env.REF and .created_at < env.CREATED) | .id')
          for id in $ids; do gh api -X DELETE "repos/$REPO/actions/caches/$id" >/dev/null || true; done
  # Pull requests only: every root test five times, uncached, failing on any
  # FLAKY. It ran inside unit-tests until 2026-11-16, where it added 7+ min to
  # that job's critical path; as its own job it runs beside unit-tests. It
  # restores the unit-tests disk cache shard (read only) so the builds replay
  # and only the test runs execute.
  flake-sweep:
    defaults:
      run:
        working-directory: rules_flutter
    name: Flake sweep (root unit tests, pull requests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DISK_CACHE_DIR: ~/.cache/bazel-disk
      DISK_CACHE_SHARD: linux-unit
    steps:
      - uses: actions/checkout@v7
      - name: Enable Linux sandbox user namespaces
        run: .github/scripts/enable_linux_sandbox.sh
      - name: Set disk cache key
        run: |
          echo "DISK_CACHE_KEY=ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-${{ hashFiles('rules_flutter/MODULE.bazel', 'rules_flutter/MODULE.bazel.lock', 'rules_flutter/e2e/*/MODULE.bazel', 'rules_flutter/flutter/private/versions.bzl') }}" >> "$GITHUB_ENV"
          echo "DISK_CACHE_SAVE_KEY=ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-${{ hashFiles('rules_flutter/MODULE.bazel', 'rules_flutter/MODULE.bazel.lock', 'rules_flutter/e2e/*/MODULE.bazel', 'rules_flutter/flutter/private/versions.bzl') }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          module-root: rules_flutter
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: false
      - name: Restore disk cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
          restore-keys: ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-
      - name: Point Bazel at the disk cache
        run: |
          dir="${{ env.DISK_CACHE_DIR }}"
          case "$dir" in "~"*) dir="$HOME${dir#\~}";; esac
          mkdir -p "$dir"
          echo "build --disk_cache=$dir" >> ~/.bazelrc
      - name: bazel test //... 5x flake sweep (root unit tests)
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/flake_sweep.log"
          bazel test //... --flaky_test_attempts=1 --runs_per_test=5 --runs_per_test_detects_flakes --nocache_test_results --test_tag_filters=-manual --test_output=errors 2>&1 | tee "$log"
          if grep -E '(^|[[:space:]])FLAKY([,[:space:]]|$)' "$log"; then
