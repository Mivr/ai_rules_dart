          ids=$(CREATED="$created" gh api "$list" --jq '.actions_caches[] | select(.key != env.DISK_CACHE_SAVE_KEY and .ref == env.REF and .created_at < env.CREATED) | .id')
          for id in $ids; do gh api -X DELETE "repos/$REPO/actions/caches/$id" >/dev/null || true; done
  e2e-windows:
    defaults:
      run:
        working-directory: rules_flutter
    name: E2E (hello_world, windows-latest)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      DISK_CACHE_DIR: D:/_bazel-disk
      DISK_CACHE_SHARD: windows-hello
    steps:
      - uses: actions/checkout@v7
      - uses: ./rules_flutter/.github/actions/android-ndk
      - name: Set disk cache key
        shell: bash
        run: |
          echo "DISK_CACHE_KEY=ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-${{ hashFiles('rules_flutter/MODULE.bazel', 'rules_flutter/MODULE.bazel.lock', 'rules_flutter/e2e/*/MODULE.bazel', 'rules_flutter/flutter/private/versions.bzl') }}" >> "$GITHUB_ENV"
          echo "DISK_CACHE_SAVE_KEY=ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-${{ hashFiles('rules_flutter/MODULE.bazel', 'rules_flutter/MODULE.bazel.lock', 'rules_flutter/e2e/*/MODULE.bazel', 'rules_flutter/flutter/private/versions.bzl') }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      # See the note above for the shared repository cache. The output base
      # setup-bazel sets (D:/_bazel) takes precedence over the Windows step's
      # --output_user_root and is as short.
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          module-root: rules_flutter
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.uncached }}
      - name: Restore disk cache
        if: github.event_name != 'schedule' && !inputs.uncached
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
          restore-keys: ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-
      # PowerShell, so ~/.bazelrc is the same file setup-bazel wrote (unlike
      # Git Bash, whose home can differ).
      - name: Point Bazel at the disk cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "${{ env.DISK_CACHE_DIR }}" | Out-Null
          Add-Content ~/.bazelrc "build --disk_cache=${{ env.DISK_CACHE_DIR }}"
      # GitHub's windows-latest image exports ANDROID_NDK_HOME with backslashes
      # (C:\Android\...), but rules_android_ndk's _create_symlinks() strips the
      # NDK prefix with a forward-slash string match against ctx.path() output,
      # so a backslashed value makes the symlink target escape the repo dir and
      # the fetch fails. Hand it a forward-slash path, as upstream's own Windows
      # CI does. See https://github.com/bazelbuild/rules_android_ndk/pull/108
      - name: Normalize ANDROID_NDK_HOME to forward slashes (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ndk = $env:ANDROID_NDK_HOME ?? $env:ANDROID_NDK_ROOT
          "ANDROID_NDK_HOME=$($ndk -replace '\\','/')" >> $env:GITHUB_ENV
      # The Windows e2e_runner step is not done: the runner always passes its own
      # temp-dir --output_base, which overrides the short --output_user_root
      # below, and it has no way to carry the -no-windows-ci tag filters.
      # On Windows, Bazel's default output root lives under a long per-user
      # temp path; nested runfiles (e.g. the hermetic Python interpreter's
      # _socket.pyd used by rules_android's aar_embedded_jars_extractor) then
      # exceed the 260-char MAX_PATH limit and fail to load with
      # "DLL load failed ... The filename or extension is too long".
      # A short --output_user_root keeps every generated path well under MAX_PATH.
      # (`BAZEL_OUTPUT_BASE` is not read by Bazel; the startup flag is required.)
      # --*_tag_filters=-no-windows-ci skips targets that build fine on
      # macOS/Linux but exceed the windows-latest runner's commit limit
      # (RAM + its small fixed pagefile). Today that's hello_world's Android
      # target: rules_android's resource compiler launches its JVM with
      # -Xms3G, eagerly committing 3 GiB and OOMing. Android is still covered
      # on the macOS and Linux runners. The build filter (not just the test
      # filter) is required because `bazel test //...` builds every matched
      # target, including the non-test app, so a test-only filter wouldn't
      # stop the OOMing build action.
      # The lockfiles are made on Linux x64 (rules_dart/docs/CHORES.md, "Lock
      # File Refresh"): prove the one of the workspace built below holds on
      # Windows, where no extension of the graph may need an entry that a Linux
      # lockfile lacks. It analyzes what the next step tests, and nothing more.
      - name: Lockfile holds on Windows
        working-directory: rules_flutter/e2e/hello_world
        run: bazel build --nobuild --build_tests_only --lockfile_mode=error //...
      # `--keep_going` and `!cancelled()`: a failure no longer hides the ones
      # behind it. Every target that can build builds and tests, and the next
      # workspace runs after a red one, so one run lists every Windows
      # failure of the job, not the first. (Each round of this job used to
      # cost one failure.) The job is red if any step is.
      - name: bazel test //... (e2e/hello_world)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        working-directory: rules_flutter/e2e/hello_world
        run: bazel --output_user_root=C:/b test //... --keep_going --test_output=errors --build_tag_filters=-no-windows-ci --test_tag_filters=-no-windows-ci
      - name: bazel test //... (e2e/windows_example)
        if: ${{ !cancelled() }}
        working-directory: rules_flutter/e2e/windows_example
        run: bazel --output_user_root=C:/b test //... --keep_going --test_output=errors
      - name: Report cache sizes
        if: always()
        shell: bash
        run: du -sh D:/_bazel-disk D:/_bazel-repo C:/_bazel-disk C:/_bazel-repo 2>/dev/null || true
      - name: Save disk cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.uncached
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_SAVE_KEY }}
      # Each save gets its own key (run id and attempt), so a restore always
      # finds a complete entry: deleting the key before re-saving it left a
      # window in which concurrent runs restored nothing and built cold. Once
      # this run's entry exists, drop this shard's entries created before it on
      # this ref; a newer entry from a concurrent run is kept.
      - name: Prune older disk cache entries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.uncached
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
        run: |
          prefix="${DISK_CACHE_KEY%-*}-"
          list="repos/$REPO/actions/caches?per_page=100&key=$prefix"
          created=$(gh api "$list" --jq '.actions_caches[] | select(.key == env.DISK_CACHE_SAVE_KEY and .ref == env.REF) | .created_at')
          if [ -z "$created" ]; then
            echo "::warning::$DISK_CACHE_SAVE_KEY was not saved; keeping the older entries"
            exit 0
          fi
          ids=$(CREATED="$created" gh api "$list" --jq '.actions_caches[] | select(.key != env.DISK_CACHE_SAVE_KEY and .ref == env.REF and .created_at < env.CREATED) | .id')
          for id in $ids; do gh api -X DELETE "repos/$REPO/actions/caches/$id" >/dev/null || true; done
  # The hooks in .pre-commit-config.yaml, over every file. Nothing else runs
  # them for a commit made without `prek install`.
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: j178/prek-action@v3.0.1
        with:
          # Keep in step with prek in multitool.lock.json
          prek-version: 0.5.5
  dart-tool-tests:
    defaults:
      run:
        working-directory: rules_flutter
    name: Dart tool tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      # `-x runfiles`: those tests read fixtures through the runfiles tree,
      # which exists under `bazel test` only. These tools are Bazel scripts,
      # and two of them import packages that arrive
      # through their `dart_test` deps rather than through this pubspec
      # (`flutter_test_runner` imports `package:runfiles`, `kernel_filter`'s
      # guard imports `package:rules_dart_guard`). Excluded here, covered by
      # //flutter/private/tools:flutter_test_runner_test and
      # //flutter/private/tools:kernel_filter_test, which the `unit-tests`
      # job runs via `bazel test //...`.
      - name: Run private tool tests
        working-directory: rules_flutter/flutter/private/tools
        run: dart pub get && dart test -x runfiles
  reproducibility:
    defaults:
      run:
        working-directory: rules_flutter
    name: Reproducibility canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Enable Linux sandbox user namespaces
        run: .github/scripts/enable_linux_sandbox.sh
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          module-root: rules_flutter
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: false
      - name: Verify canary output differs across distinct output bases
        working-directory: rules_flutter/e2e/repro_canary
        run: |
          trap 'bazel --output_base="${RUNNER_TEMP}/repro_canary_a" shutdown; bazel --output_base="${RUNNER_TEMP}/repro_canary_b" shutdown' EXIT
          bazel "--output_base=${RUNNER_TEMP}/repro_canary_a" build //:canary
          if [ ! -s bazel-bin/canary.bin ]; then
            echo "e2e/repro_canary: output missing or empty in run A" >&2
            exit 1
          fi
          sum_a=$(sha256sum bazel-bin/canary.bin | awk '{print $1}')

          bazel "--output_base=${RUNNER_TEMP}/repro_canary_b" build //:canary
          if [ ! -s bazel-bin/canary.bin ]; then
            echo "e2e/repro_canary: output missing or empty in run B" >&2
            exit 1
          fi
          sum_b=$(sha256sum bazel-bin/canary.bin | awk '{print $1}')

          if [ -z "$sum_a" ] || [ -z "$sum_b" ]; then
            echo "e2e/repro_canary: sha256 checksum missing or empty" >&2
            exit 1
          fi

          echo "Run A sha256: $sum_a"
          echo "Run B sha256: $sum_b"

          if [ "$sum_a" = "$sum_b" ]; then
            echo "e2e/repro_canary: canary outputs are equal across distinct output bases ($sum_a)" >&2
            exit 1
          fi
  # Repository checks that each take seconds to a minute of Bazel, run in one
  # job so they share one runner, one setup and one Bazel server. Repository
  # cache only (shared per OS, no disk-cache shard): this job restores what
  # ci.yaml saves and never writes a cache, like commit-messages.yaml. The
  # lockfile steps run first, on the clean checkout; every later step runs
  # even when an earlier one failed, so one red check does not hide another.
  # - Module lockfile is tidy: fails when `bazel mod tidy` would rewrite the
  #   root module files, so a stale MODULE.bazel.lock fails the run.
  # - Repo contents cache: fails when a repository that returns
  #   `repo_metadata(reproducible = True)` is extracted into every output base
  #   instead of shared through the repo contents cache, or holds an absolute
  #   or repo-escaping symlink. Each run of //tools/repo_contents_cache fetches
  #   into two fresh output bases that share the repository cache and one
  #   temporary repo contents cache.
  repo-checks:
    defaults:
      run:
        working-directory: rules_flutter
    name: Repo checks (lockfile tidy, e2e coverage, repo contents cache)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Enable Linux sandbox user namespaces
        run: .github/scripts/enable_linux_sandbox.sh
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          module-root: rules_flutter
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: false
      - name: bazel mod tidy --lockfile_mode=refresh
        run: bazel mod tidy --lockfile_mode=refresh
      - name: bazel build --nobuild --lockfile_mode=update //...
        run: bazel build --nobuild --lockfile_mode=update //...
      - name: bazel build --nobuild --lockfile_mode=error //...
        run: bazel build --nobuild --lockfile_mode=error //...
      - name: git diff --exit-code MODULE.bazel MODULE.bazel.lock
        run: git diff --exit-code MODULE.bazel MODULE.bazel.lock
      - name: Host SDK, web SDK, sky_engine, dev_root, fonts, a tool_deps spoke, sysroot, Chrome and Linux runtime
        if: ${{ !cancelled() }}
        run: >
          bazel run //tools/repo_contents_cache --
          @@+flutter+flutter_linux-x64
          @flutter_web_sdk
          @flutter_sky_engine
          @flutter_dev_root
          @flutter_material_fonts
          @@+flutter+flutter_font_subset_linux-x64
          @@+flutter+tool_deps__args
          @@+flutter+flutter_linux_sysroot_x64
          @flutter_chrome_headless_shell
          @flutter_linux_headless_runtime
      - name: A Flutter SDK spoke
        if: ${{ !cancelled() }}
        run: >
          bazel run //tools/repo_contents_cache --
          --workspace=e2e/web_example
          @@ai_rules_flutter++flutter+deps__flutter
      - name: Negative case, local_path repos stay real directories
        if: ${{ !cancelled() }}
        run: >
          bazel run //tools/repo_contents_cache --
          --workspace=e2e/smoke
          --expect=real
          @local_sky_engine
          @local_linux-x64
          @local_dev_root
  # Early warning, permanently non-blocking: runs the root tests on Bazel's
  # last release candidate so a break in the next Bazel release shows up before
  # it ships. An upstream release-candidate regression must never block a merge
  # or a tag-push release, so the job is deliberately absent from
  # `conclusion.needs` and carries `continue-on-error`. The lockfile is off
  # because no committed lock can match an unreleased Bazel. It runs in the
  # nightly and on dispatches (release tags) only: on every push and pull
  # request it held a runner for 7 to 17 min that nothing waited on.
  last_rc:
    defaults:
      run:
        working-directory: rules_flutter
    name: Bazel last_rc (early warning)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      USE_BAZEL_VERSION: last_rc
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          module-root: rules_flutter
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: false
      # The target Java runtime is the runner's `local_jdk`, which is a JDK
      # newer (27) than the one that runs javac (the `remotejdk_25` of
      # `--tool_java_runtime_version` in .bazelrc), and javac refuses to
      # compile for it ("not recent enough to compile for the Java 27
      # runtime"). Pin the target to the tools' own JDK, as .bazelrc does for
      # the tools, so the job does not depend on the runner image's JDK.
      - name: bazel test --lockfile_mode=off //... --test_output=errors
        run: bazel test --lockfile_mode=off --java_runtime_version=remotejdk_25 --java_language_version=25 //... --test_output=errors
  # Burn-in for the incompatible flags Bazel has yet to flip: runs the root
  # tests under `--config=strict` (tools/strict.bazelrc). Non-blocking, so the
  # job carries `continue-on-error` and is absent from `conclusion.needs`. It
  # becomes blocking when the burn-in ends on 2026-11-14; it is added to
  # `conclusion.needs` then. Until then it runs in the nightly and on
  # dispatches (release tags) only: on every push and pull request it held a
  # runner for 7 to 22 min that nothing waited on.
  strict:
    defaults:
      run:
        working-directory: rules_flutter
    name: Bazel strict flags (burn-in)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          module-root: rules_flutter
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: false
      - name: bazel test --config=strict //... --test_output=errors
        run: bazel test --config=strict //... --test_output=errors
  conclusion:
    name: Conclusion
    needs: [full, e2e-macos-apple, e2e-macos-toolchain, unit-tests, flake-sweep, e2e-linux-app, e2e-linux-small, e2e-linux-examples, e2e-linux-pub-scc, e2e-linux-integration, e2e-linux-android, e2e-windows, repo-checks, dart-tool-tests, pre-commit, reproducibility]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail if any job failed
        run: echo '${{ toJSON(needs) }}' | jq -e 'with_entries(select(.value.result != "success" and .value.result != "skipped")) | length == 0'
