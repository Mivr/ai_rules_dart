name: Perf Linux
on:
  workflow_dispatch:
    inputs:
      head_ref:
        description: "Git ref under measurement"
        required: true
        type: string
      target_loc:
        description: "Target lines of Dart code"
        required: false
        default: "500000"
        type: string
      repeats:
        description: "Number of measured repeats"
        required: false
        default: "3"
        type: string
      seed:
        description: "Deterministic random seed"
        required: false
        default: "1"
        type: string
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout bench tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: tools-src
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: false
          disk-cache: false
          external-cache: false
          repository-cache: false
          cache-save: false
      - name: Configure tooling Bazel version
        run: |
          if [ -f tools-src/.bazelversion ]; then
            cp tools-src/.bazelversion tools-src/tools/.bazelversion
          fi
      - name: Checkout rules under measurement
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.head_ref }}
          path: rules-head
          fetch-depth: 0
      - name: Generate pristine monorepo
        env:
          TARGET_LOC: ${{ inputs.target_loc }}
          SEED: ${{ inputs.seed }}
        run: |
          ws="${RUNNER_TEMP}/pristine-ws"
          tooling_base="${RUNNER_TEMP}/tooling-outbase"
          mkdir -p "$ws"
          (cd tools-src/tools && bazel --max_idle_secs=60 --output_base="$tooling_base" run //perf:generate -- \
            --target-loc="$TARGET_LOC" \
            --seed="$SEED" \
            --rules-dart="$GITHUB_WORKSPACE/rules-head" \
            --out="$ws")
      - name: Commit lockfile via unmeasured analysis-only pass
        run: |
          ws="${RUNNER_TEMP}/pristine-ws"
          scratch_base="${RUNNER_TEMP}/scratch-outbase"
          cleanup_scratch() {
            (cd "$ws" && bazel --max_idle_secs=60 --output_base="$scratch_base" shutdown) || echo "bazel shutdown failed" >&2
            chmod -R u+w "$scratch_base" 2>/dev/null || echo "scratch cleanup chmod failed" >&2
            rm -rf "$scratch_base"
          }
          trap cleanup_scratch EXIT
          leaf_tests=$(cd "$ws" && bazel --max_idle_secs=60 --output_base="$scratch_base" query 'kind(dart_test, //...)')
          test -n "$leaf_tests"
          # shellcheck disable=SC2086
          (cd "$ws" && bazel --max_idle_secs=60 --output_base="$scratch_base" build --nobuild --lockfile_mode=update //app:app $leaf_tests)
          cleanup_scratch
          trap - EXIT
          test -f "$ws/MODULE.bazel.lock"
      - name: Run speed-of-light runner repeats
        env:
          REPEATS: ${{ inputs.repeats }}
        run: |
          ws="${RUNNER_TEMP}/pristine-ws"
          tooling_base="${RUNNER_TEMP}/tooling-outbase"
          results="${RUNNER_TEMP}/bench-results"
          case "$REPEATS" in
            '' | *[!0-9]* | 0*)
              echo "repeats must be a positive integer >= 1, got '$REPEATS'" >&2
              exit 1
              ;;
          esac
          mkdir -p "$results"
          failed=0
          for i in $(seq 1 "$REPEATS"); do
            (cd tools-src/tools && bazel --max_idle_secs=60 --output_base="$tooling_base" run //perf:runner -- \
              --workspace="$ws" \
              --repeat="$i" \
              --repeats="$REPEATS" \
              --out="$results/repeat-$i.json") || failed=1
          done
          exit "$failed"
      - name: Summarize speed-of-light results
        if: ${{ !cancelled() }}
        env:
          HEAD_REF: ${{ inputs.head_ref }}
          TARGET_LOC: ${{ inputs.target_loc }}
          SEED: ${{ inputs.seed }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          tooling_base="${RUNNER_TEMP}/tooling-outbase"
          results="${RUNNER_TEMP}/bench-results"
          case "$REPEATS" in
            '' | *[!0-9]* | 0*)
              echo "repeats must be a positive integer >= 1, got '$REPEATS'" >&2
              exit 1
              ;;
          esac
          mkdir -p "$results"
          if ! sha="$(git -C "$GITHUB_WORKSPACE/rules-head" rev-parse HEAD 2>/dev/null)"; then
            sha="$HEAD_REF"
          fi
          summary_rc=0
          (cd tools-src/tools && bazel --max_idle_secs=60 --output_base="$tooling_base" run //perf:summarize -- \
            --results-dir="$results" \
            --sha="$sha" \
            --target-loc="$TARGET_LOC" \
            --seed="$SEED" \
            --repeats="$REPEATS" \
            --out="$GITHUB_WORKSPACE/dart-sol.json") || summary_rc=$?
          if [ -f "$GITHUB_WORKSPACE/dart-sol.json" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat "$GITHUB_WORKSPACE/dart-sol.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$summary_rc"
      - name: Shut down tooling Bazel server
        if: ${{ always() }}
        run: |
          tooling_base="${RUNNER_TEMP}/tooling-outbase"
          if [ -d tools-src/tools ]; then
            (cd tools-src/tools && bazel --max_idle_secs=60 --output_base="$tooling_base" shutdown) || echo "bazel shutdown failed" >&2
          fi
      - name: Upload dart-sol artifact
        if: ${{ !cancelled() && inputs.head_ref != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: dart-sol
          path: dart-sol.json
          retention-days: 3
