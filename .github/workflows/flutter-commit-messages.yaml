# Checks every commit pushed to main against the commit policy in AGENTS.md:
# a conventional-commit subject and a `Changelog:` trailer on user-visible
# commits. Changes land on main directly, so this runs on push rather than on
# pull requests.
name: Flutter Commit messages
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    defaults:
      run:
        working-directory: rules_flutter
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Enable Linux sandbox user namespaces
        run: .github/scripts/enable_linux_sandbox.sh
      # Restores the repository cache ci.yaml saves; the key files must match
      # its BAZEL_REPOSITORY_CACHE_KEY_FILES.
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          module-root: rules_flutter
          repository-cache: |
            - rules_flutter/MODULE.bazel
            - rules_flutter/MODULE.bazel.lock
            - rules_flutter/e2e/*/MODULE.bazel
            - rules_flutter/flutter/private/versions.bzl
          cache-save: false
      - name: Check the pushed commits
        run: bazel run //tools/changelog:check -- --range "${{ github.event.before }}..${{ github.sha }}"
