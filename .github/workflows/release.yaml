# Mivr/ai_rules_dart workflow (moved from the frozen Mivr/rules_dart fork on 2026-10-28).
# Cut a release whenever a new tag is pushed to the repo.
name: Release
on:
  # Can be triggered from the tag.yaml workflow
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  # Or, developers can manually push a tag from their clone
  push:
    tags:
      - "v*.*.*"
permissions:
  id-token: write
  attestations: write
  contents: write
  # The gate dispatches ci.yaml and full.yaml on the tag, and polls their runs.
  actions: write
jobs:
  # Releases reuse proof instead of replaying tests. A tag push starts no CI or
  # Full run. For each of ci.yaml and full.yaml, release_gate.sh takes the first
  # of: a successful nightly `schedule` run on the tagged commit (reused as it
  # is), or the newest `workflow_dispatch` run on the tag, which the gate
  # dispatches with `uncached: true` when none exists yet. Dispatched runs run
  # every job uncached, so a green gate means every test executed on the tagged
  # commit. The gate judges each run's current status on every poll, and it
  # fails closed: a failed or cancelled run, a dispatched run that never appears,
  # or no passing run within the deadline blocks the release.
  gate:
    runs-on: ubuntu-latest
    # The gate's deadline is 350 minutes: uncached CI takes ~25 minutes and the
    # uncached Full matrix ~60 minutes, with headroom for slow runners. The
    # timeout only bounds a hung gate past that deadline. GitHub caps jobs at
    # 6 h.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reuse a nightly proof or run the uncached CI and Full workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag_name || github.ref_name }}
          SHA: ${{ github.sha }}
        run: bash .github/workflows/release_gate.sh "$TAG" "$SHA"
  release:
    needs: gate
    # No timeout-minutes here: GitHub rejects it on jobs that call a reusable
    # workflow. The gate job above carries its own timeout.
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@1d798ff015ed0696433e01e2c3ccbb2abefadad7 # v7.7.0
    with:
      release_files: rules_dart-*.tar.gz
      # The gate job above already refuses to release without passing CI and
      # Full runs on the tagged commit (a nightly or an uncached dispatch), so
      # this job repeats no tests: it only builds the root workspace to verify
      # the checkout before cutting the archive. A cold `bazel test //...` here
      # timed out small tests on v0.11.0 even though the same commit was green,
      # so testing again buys no coverage and only reintroduces cold-runner
      # flakes.
      bazel_test_command: bazel build //...
      # No setup-bazel caches: a tag ref's caches are never restored by any
      # later run; they only evict main's under the 10 GB repository limit.
      mount_bazel_caches: false
      prerelease: false
      tag_name: ${{ inputs.tag_name || github.ref_name }}
