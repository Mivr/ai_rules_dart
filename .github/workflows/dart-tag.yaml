# Mivr/ai_rules_dart workflow (moved from the frozen Mivr/rules_dart fork on 2026-10-28).
# Cut a release from the GitHub UI: Actions > "Tag a Release" > Run workflow on
# `main`, with the version to release. The run tags the commit it was
# dispatched on and calls release.yaml, whose gate requires CI and Full to pass
# on that commit before anything is published.
#
# The version is typed in rather than derived from commit messages: a `!`
# commit in a 0.x release is a minor bump here, and the version is the
# releaser's call.
name: Dart Tag a Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, as vMAJOR.MINOR.PATCH (e.g. v0.30.0)
        required: true
        type: string
  # auto-release.yaml calls this with the version next_version chose and the
  # main commit that both CI and Full passed on.
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      sha:
        description: Commit on main to tag; empty tags the dispatched commit
        required: false
        type: string
        default: ""
jobs:
  tag:
    # Disabled in the merged repository until releasing moves here (later task).
    if: false
    defaults:
      run:
        working-directory: rules_dart
    permissions:
      contents: write # allow create tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Every tag, to refuse a version that exists or is not newer.
          fetch-depth: 0
      - name: Tag the dispatched commit
        id: tag
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.sha || github.sha }}
        # The tag is pushed with GITHUB_TOKEN, so it does not start release.yaml's
        # tag-push trigger a second time; the release job below calls it.
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::Run this on main, not $GITHUB_REF"; exit 1; }
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like v1.2.3, got '$VERSION'"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }
          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)
          if [[ -n "$latest" && "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]] || [[ "$VERSION" == "$latest" ]] || git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::$VERSION exists or is not newer than $latest"; exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "$VERSION" -m "rules_dart $VERSION" "$SHA"
          git push origin "refs/tags/$VERSION"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
  release:
    # Disabled in the merged repository until releasing moves here (later task).
    if: false
    needs: tag
    # A reusable-workflow call: `uses:` jobs take no timeout-minutes (only
    # the called workflow's own jobs can carry one).
    uses: ./.github/workflows/dart-release.yaml
    with:
      tag_name: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      # The release.yaml gate job dispatches and polls the CI and Full runs.
      actions: write
