# Cut a release of rules_flutter from the GitHub UI: Actions > "Flutter Tag a
# Release" > Run workflow on `main`, with the version to release. The run tags
# the commit it was dispatched on as `rules_flutter-<version>` and calls
# flutter-release.yaml, whose gate requires Flutter CI and Flutter Full to pass on that
# commit before anything is published. The steps of a release, and how to stop
# one, are in RELEASING.md at the repository root.
#
# One repository holds two modules, each with its own tag line:
# `rules_flutter-v0.30.3` and `rules_flutter-v0.30.3`. The version is typed in
# rather than derived from commit messages: a `!` commit in a 0.x release is a
# minor bump here, and the version is the releaser's call.
#
# Every release job of every workflow is off until the repository variable
# RELEASES_ENABLED is `true` (Settings > Secrets and variables > Actions >
# Variables); unset, a run of this workflow shows its jobs skipped.
name: Flutter Tag a Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, as vMAJOR.MINOR.PATCH (e.g. v0.30.3); the tag is rules_flutter-<version>
        required: true
        type: string
  # flutter-auto-release.yaml calls this with the version `release next` chose and
  # the main commit that both CI and Full passed on.
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      sha:
        description: Commit on main to tag; empty tags the dispatched commit
        required: false
        type: string
        default: ""
jobs:
  tag:
    if: vars.RELEASES_ENABLED == 'true'
    defaults:
      run:
        working-directory: rules_flutter
    permissions:
      contents: write # allow create tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Every tag, to refuse a version that exists or is not newer.
          fetch-depth: 0
      - name: Enable Linux sandbox user namespaces
        run: .github/scripts/enable_linux_sandbox.sh
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          module-root: rules_dart/tools
          bazelisk-cache: true
          repository-cache: true
          cache-save: false
      - name: The floor on rules_dart is a published release
        env:
          GH_TOKEN: ${{ github.token }}
        # A consumer resolves rules_flutter's bazel_dep on ai_rules_dart from
        # the GitHub release of that version. Inside the repository the number
        # is inert, so nothing else proves it: refuse the tag while the floor
        # names a release that does not exist, or places that name it differ.
        run: |
          floor=$(cd ../rules_dart/tools && bazel run --ui_event_filters=-info --noshow_progress --show_result=0 \
            //release:release -- floor check)
          draft=$(gh release view "rules_dart-v$floor" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) ||
            { echo "::error::rules_flutter's floor is ai_rules_dart $floor, which has no release rules_dart-v$floor"; exit 1; }
          [[ "$draft" == false ]] || { echo "::error::release rules_dart-v$floor is a draft"; exit 1; }
      - name: Tag the dispatched commit
        id: tag
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.sha || github.sha }}
        # The tag is pushed with GITHUB_TOKEN, so it does not start
        # flutter-release.yaml's tag-push trigger a second time; the release job
        # below calls it.
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::Run this on main, not $GITHUB_REF"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }
          # The tag of this module for the version, refused when it exists or
          # is not newer than the module's latest release (.github/release.json).
          # The tool is rules_dart/tools' (one copy for both modules).
          tag=$(cd ../rules_dart/tools && bazel run --ui_event_filters=-info --noshow_progress --show_result=0 \
            //release:release -- tag --module=rules_flutter --version="$VERSION")
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "$tag" -m "rules_flutter $VERSION" "$SHA"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  release:
    if: vars.RELEASES_ENABLED == 'true'
    needs: tag
    # A reusable-workflow call: `uses:` jobs take no timeout-minutes (only
    # the called workflow's own jobs can carry one).
    uses: ./.github/workflows/flutter-release.yaml
    with:
      tag_name: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      # The flutter-release.yaml gate job dispatches and polls the CI and Full runs.
      actions: write
