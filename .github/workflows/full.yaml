name: Full matrix
# Pre-release coverage: the complete per-folder macOS matrix that push CI
# (ci.yaml) no longer runs. Linux and Windows keep full coverage on every
# push, so they are not repeated here. Releases require passing tag-push runs
# of this workflow AND of ci.yaml on the tagged commit (see release.yaml).
# Triggers: tag pushes (`v*`), the nightly schedule, and manual dispatch.
# Tag-push and `schedule` runs are UNCACHED (see the cache inputs below): no
# Bazel disk cache and no external cache is restored and nothing is saved, so
# every test really executes instead of replaying the disk cache; only the
# content-addressed repository cache and the bazelisk cache restore (every
# fetch is sha256-pinned). Branch pushes never trigger this workflow; pass
# `uncached: true` to a manual dispatch for a cold run. A tag push runs every
# job, matrix entry and step below, uncached: no job skips work on a tag push
# that the nightly `schedule` run does. It has no 7-minute target, but its
# macOS jobs run one at a time (`max-parallel: 1`) so a concurrent push run's
# macOS smoke job keeps a slot.
on:
  workflow_dispatch:
    inputs:
      uncached:
        description: Run every test job without restoring or saving any Bazel cache
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 10 * * *"
concurrency:
  group: concurrency-group::${{ github.workflow }}::${{ github.ref_name }}${{ github.ref_name == 'main' && format('::{0}', github.run_id) || ''}}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
jobs:
  # Same folders, commands and flags as the old per-folder macOS jobs from
  # ci.yaml, in 2 shards sharing one Bazel disk cache per shard on cached
  # (manual dispatch) runs. The repository and bazelisk caches keep their
  # shared keys.
  # Each folder runs under its own Bazel server (`--output_base` under
  # RUNNER_TEMP): the folders of a shard otherwise share the output base
  # setup-bazel pins, so concurrent folders wait on its lock, kill each
  # other's servers and flake with exit 1. The disk and repository caches
  # stay shared, so cache warmth is unaffected.
  # Red-by-design workspaces (ci.yaml's `expected-failure` job) and the
  # pub-fetch Powershell/PATH steps are push-CI-only and not repeated here:
  # on a tag push, ci.yaml itself runs uncached, so the release gate still
  # proves them on the tagged commit.
  # Each folder's log is streamed under a `===== <folder> =====` header the
  # moment that folder finishes (not after all waves), and uploaded as an
  # artifact `if: always()`, so a killed job still leaves its evidence.
  test-macos:
    name: test-macos (shard ${{ matrix.shard }})
    runs-on: macos-latest
    # Cold tag-push and nightly runs need the headroom. GitHub caps jobs at
    # 6 h.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - shard: 1
            parallelism: 3
            cache: full-macos-1
            folders: |
              .
              e2e/pub_lock_upgrade
              dev
              e2e/web_app
              .github/workflows
              e2e/fix
              e2e/pub_lock_scc
              e2e/codegen
              e2e/pub_lock
              e2e/hello_world
              e2e/smoke
              e2e/dart_test
              e2e/dual_build
              e2e/analysis
          - shard: 2
            parallelism: 3
            cache: full-macos-2
            folders: |
              e2e/ext_exemplar
              e2e/gazelle
              e2e/link_hook
              tools
              e2e/analyze_composition
              e2e/cross_compile
              e2e/pub_deps
              e2e/pub_lock_git
              e2e/pub_lock_cross_module
              e2e/pub_lock_dedup
              e2e/library_deps
              e2e/dart_test_pkg
              e2e/isolated_hub
              e2e/guard_reuse
              e2e/root_sdk_pin
              e2e/sdk_coupling
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          # Only manual dispatches without `uncached: true` restore and save
          # caches. Tag pushes (`github.ref_type == 'tag'`) and `schedule`
          # runs restore neither the Bazel disk cache nor the external cache
          # and save nothing, so every test really executes instead of
          # replaying the disk cache. The content-addressed repository cache
          # and the bazelisk cache still restore (every fetch is
          # sha256-pinned).
          disk-cache: ${{ github.event_name != 'schedule' && github.ref_type != 'tag' && !inputs.uncached && matrix.cache || false }}
          external-cache: ${{ github.event_name != 'schedule' && github.ref_type != 'tag' && !inputs.uncached }}
          repository-cache: ${{ github.event_name != 'schedule' && !inputs.uncached }}
          cache-save: ${{ github.event_name != 'schedule' && github.ref_type != 'tag' && !inputs.uncached }}
          cache-version: "1"
          bazelrc: |
            common --announce_rc
            common --color=yes
            common --enable_bzlmod=true
            # Memory bounds: a shard runs PARALLELISM=3 folders at once (see
            # the Test step). By default every server grows its JVM heap to
            # ~1/4 of host RAM and schedules actions as if it owned the whole
            # machine, so concurrent cold servers exhaust a 4-CPU/16 GB runner
            # and the job dies on a shutdown signal (exit 143). Per server:
            # heap 2 GB (3 x 2 = 6 GB, was ~3 x 4 = 12 GB), 1 CPU (3 of 4
            # cores), scheduled RAM 15% of host RAM (3 x 15% = 45%, ~7.2 GB of
            # 16 GB): heaps plus scheduled actions stay near ~13 GB, leaving
            # room for the OS, the Bazel clients and JVM off-heap.
            # HOST-relative so smaller runners (macOS) scale the same
            # fractions. Scheduling limits only: action keys are unchanged, so
            # cache warmth is unaffected.
            startup --host_jvm_args=-Xmx2g
            build --local_resources=cpu=1
            build --local_resources=memory=HOST_RAM*.15
      - name: Test
        env:
          FOLDERS: ${{ matrix.folders }}
          PARALLELISM: ${{ matrix.parallelism }}
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE//\\//}"
          # Per-folder logs live under RUNNER_TEMP so the upload step below
          # can ship them even when this step fails or the job is killed.
          logdir="${RUNNER_TEMP}/shard-logs"
          rm -rf "$logdir"
          mkdir -p "$logdir"
          # One Bazel server per folder (see run_one below): without this the
          # folders of a shard share the output base setup-bazel pins, so
          # each folder waits on "Another command holds the output base
          # lock" and kills the previous folder's server. The disk and
          # repository caches stay shared, so cache warmth is unaffected.
          outbasedir="${RUNNER_TEMP}/bazel-servers"
          # Pin the Bazel version in every folder of this shard, as the old
          # per-folder Configure step did.
          while IFS= read -r folder; do
            [ -z "$folder" ] && continue
            echo "9.3.0" > "$ws/$folder/.bazelversion"
          done <<< "$FOLDERS"
          run_one() {
            slug="$(printf '%s' "$1" | tr '/.' '_')"
            # Same command and flags as the old per-folder Test step, plus
            # a per-folder --output_base so the folder gets its own Bazel
            # server. The disk and repository caches stay shared, so warmth
            # is unaffected.
            # Exit code 4 means "build succeeded but no test targets found".
            if ( cd "$ws/$1" && bazel --output_base="$outbasedir/$slug" test --test_output=errors //... || [ $? -eq 4 ] ) >"$logdir/$slug.log" 2>&1; then
              echo 0 >"$logdir/$slug.status"
            else
              echo 1 >"$logdir/$slug.status"
            fi
          }
          running=0
          # Folders already printed by print_done below.
          printed=""
          # Print the log of every finished folder not printed yet.
          print_done() {
            while IFS= read -r folder; do
              [ -z "$folder" ] && continue
              slug="$(printf '%s' "$folder" | tr '/.' '_')"
              case " $printed " in
                *" $slug "*) continue ;;
              esac
              if [ -f "$logdir/$slug.status" ]; then
                echo "===== $folder (exit $(cat "$logdir/$slug.status")) ====="
                cat "$logdir/$slug.log"
                printed="$printed $slug "
              fi
            done <<< "$FOLDERS"
          }
          # Block until at least one more folder finishes, then stream the
          # newly finished logs. Polling (not `wait -n`) so this also runs
          # under macOS bash 3.2.
          wait_one() {
            before=0
            for s in "$logdir"/*.status; do
              [ -f "$s" ] || continue
              before=$((before + 1))
            done
            while true; do
              print_done
              have=0
              for s in "$logdir"/*.status; do
                [ -f "$s" ] || continue
                have=$((have + 1))
              done
              [ "$have" -gt "$before" ] && return 0
              sleep 10
            done
          }
          while IFS= read -r folder; do
            [ -z "$folder" ] && continue
            run_one "$folder" &
            running=$((running + 1))
            if [ "$running" -ge "$PARALLELISM" ]; then
              wait_one
              running=$((running - 1))
            fi
          done <<< "$FOLDERS"
          wait
          print_done
          fail=0
          while IFS= read -r folder; do
            [ -z "$folder" ] && continue
            slug="$(printf '%s' "$folder" | tr '/.' '_')"
            [ "$(cat "$logdir/$slug.status")" = 0 ] || fail=1
          done <<< "$FOLDERS"
          exit "$fail"
      # Ship the per-folder logs even when the Test step fails or the job is
      # killed, so a dead shard still leaves its evidence for diagnosis.
      - name: Upload shard logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shard-logs-macos-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-logs
          if-no-files-found: warn
