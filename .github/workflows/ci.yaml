          echo "OK: expected malformed-checksum error detected"
      - name: pub_git_unpinned_ref — expect a branch resolved-ref to fail the git fetch
        working-directory: e2e/pub_git_unpinned_ref
        run: |
          if bazel build @bad_git//... 2>/dev/null; then
            echo "ERROR: build should have failed with an unpinned resolved-ref error"
            exit 1
          fi
          bazel build @bad_git//... 2>&1 | grep -F -q 'pub_lock_git_package "evil_pkg" (1.0.0) requires a full 40-hex resolved-ref, got "main".'
          echo "OK: expected unpinned-ref error detected"
      - name: pub_scc_unpinned_member — expect an unpinned merged-cycle member to fail its fetch
        working-directory: e2e/pub_scc_unpinned_member
        run: |
          if bazel build @bad_scc//... 2>/dev/null; then
            echo "ERROR: build should have failed with a missing sha256 error"
            exit 1
          fi
          bazel build @bad_scc//... 2>&1 | grep -F -q 'pub_lock_scc_package "collection" (1.18.0) requires a non-empty sha256.'
          echo "OK: expected missing-checksum error detected"
      # Each `e2e/digest_mismatch` case fetches the committed fixture over a
      # local file:// URL through `pinned_download` with a different digest
      # shape. Malformed shapes fail before any bytes move with the helper's
      # own message (which names the URL, so only its stable half is grepped);
      # the wrong digest fails on Bazel's checksum comparison; the correct
      # digest succeeds. No network is involved.
      - name: digest_mismatch — expect an empty digest to fail the fetch
        working-directory: e2e/digest_mismatch
        run: |
          fail_with_output() {
            echo "ERROR: $1 not found; full output:"
            printf '%s\n' "$out"
            exit 1
          }
          if out=$(bazel build @bad_empty//... 2>&1); then
            echo "ERROR: build should have failed with an empty-digest error"
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | grep -F -q 'pinned_download: refusing to fetch' || fail_with_output "refusing-to-fetch error"
          printf '%s\n' "$out" | grep -F -q '"sha256" must be exactly 64 lowercase hex digits, got "".' || fail_with_output "empty-digest error"
          echo "OK: expected empty-digest error detected"
      - name: digest_mismatch — expect a short digest to fail the fetch
        working-directory: e2e/digest_mismatch
        run: |
          fail_with_output() {
            echo "ERROR: $1 not found; full output:"
            printf '%s\n' "$out"
            exit 1
          }
          if out=$(bazel build @bad_short//... 2>&1); then
            echo "ERROR: build should have failed with a short-digest error"
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | grep -F -q 'pinned_download: refusing to fetch' || fail_with_output "refusing-to-fetch error"
          printf '%s\n' "$out" | grep -F -q '"sha256" must be exactly 64 lowercase hex digits, got "86bea300d6701fb6c1fddc33b21235231d108b44a9793db9dcd48940fa46a6a".' || fail_with_output "short-digest error"
          echo "OK: expected short-digest error detected"
      - name: digest_mismatch — expect an uppercase digest to fail the fetch
        working-directory: e2e/digest_mismatch
        run: |
          fail_with_output() {
            echo "ERROR: $1 not found; full output:"
            printf '%s\n' "$out"
            exit 1
          }
          if out=$(bazel build @bad_upper//... 2>&1); then
            echo "ERROR: build should have failed with an uppercase-digest error"
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | grep -F -q 'pinned_download: refusing to fetch' || fail_with_output "refusing-to-fetch error"
          printf '%s\n' "$out" | grep -F -q '"sha256" must be exactly 64 lowercase hex digits, got "86BEA300D6701FB6C1FDDC33B21235231D108B44A9793DB9DCD48940FA46A6A6".' || fail_with_output "uppercase-digest error"
          echo "OK: expected uppercase-digest error detected"
      - name: digest_mismatch — expect an SRI digest to fail the fetch
        working-directory: e2e/digest_mismatch
        run: |
          fail_with_output() {
            echo "ERROR: $1 not found; full output:"
            printf '%s\n' "$out"
            exit 1
          }
          if out=$(bazel build @bad_sri//... 2>&1); then
            echo "ERROR: build should have failed with an SRI-digest error"
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | grep -F -q 'pinned_download: refusing to fetch' || fail_with_output "refusing-to-fetch error"
          printf '%s\n' "$out" | grep -F -q '"sha256" must be exactly 64 lowercase hex digits, got "sha256-hr6jANZwH7bB/dwzshI1Ix0Qi0SpeT253NSJQPpGpqY=".' || fail_with_output "SRI-digest error"
          echo "OK: expected SRI-digest error detected"
      - name: digest_mismatch — expect a conditional blank digest to fail the fetch
        working-directory: e2e/digest_mismatch
        run: |
          fail_with_output() {
            echo "ERROR: $1 not found; full output:"
            printf '%s\n' "$out"
            exit 1
          }
          if out=$(bazel build @bad_conditional//... 2>&1); then
            echo "ERROR: build should have failed with a conditional-blank-digest error"
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | grep -F -q 'pinned_download: refusing to fetch' || fail_with_output "refusing-to-fetch error"
          printf '%s\n' "$out" | grep -F -q '"sha256" must be exactly 64 lowercase hex digits, got "".' || fail_with_output "conditional-blank-digest error"
          echo "OK: expected conditional-blank-digest error detected"
      - name: digest_mismatch — expect a wrong digest to fail the fetch
        working-directory: e2e/digest_mismatch
        run: |
          fail_with_output() {
            echo "ERROR: $1 not found; full output:"
            printf '%s\n' "$out"
            exit 1
          }
          if out=$(bazel build @bad_wrong//... 2>&1); then
            echo "ERROR: build should have failed with a checksum-mismatch error"
            printf '%s\n' "$out"
            exit 1
          fi
          # Only the wanted digest is grepped: the actual digest depends on
          # the fixture bytes, which must survive every checkout unnormalized.
          printf '%s\n' "$out" | grep -F -q 'Checksum was' || fail_with_output "checksum-mismatch error"
          printf '%s\n' "$out" | grep -F -q 'but wanted 86bea300d6701fb6c1fddc33b21235231d108b44a9793db9dcd48940fa46a6a7' || fail_with_output "wanted-digest error"
          echo "OK: expected checksum-mismatch error detected"
      - name: digest_mismatch — a correct digest on the same fixture succeeds
        working-directory: e2e/digest_mismatch
        run: |
          if out=$(bazel build @good//... 2>&1); then
            echo "OK: correct digest fetched"
          else
            echo "ERROR: correct digest should have fetched; full output:"
            printf '%s\n' "$out"
            exit 1
          fi
      # A modular kernel compile rejects an import shape where a library or
      # entry source reaches a dependency-defined source through a relative
      # or multi-root URI. Each red case fails before the compiler runs with
      # the refusal naming the `package:` URI to use, under the persistent
      # worker and under the local strategy; the `package:` shape of the
      # same edges still compiles. See e2e/kernel_dep_shape/README.md.
      - name: kernel_dep_shape — expect a multi-root import of a dep source to fail the library
        working-directory: e2e/kernel_dep_shape
        run: |
          if out=$(bazel build //pkg:bad_lib_app 2>&1); then
            echo "ERROR: build should have failed with the import-shape refusal"
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | grep -F -q "cannot compile package:pkg/a.dart: import 'org-dartlang-root:///dep/lib/d.dart' reaches a source its dependencies define under 'package:dep/d.dart'; import that instead."
          if out=$(bazel build //pkg:bad_lib_app --spawn_strategy=standalone 2>&1); then
            echo "ERROR: local-strategy build should have failed with the import-shape refusal"
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | grep -F -q "reaches a source its dependencies define under 'package:dep/d.dart'; import that instead."
          echo "OK: expected import-shape refusal detected"
      - name: kernel_dep_shape — expect a relative import of a dep source to fail the entry
        working-directory: e2e/kernel_dep_shape
        run: |
          if out=$(bazel build //pkg:bad_bin 2>&1); then
            echo "ERROR: build should have failed with the import-shape refusal"
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | grep -F -q "cannot compile org-dartlang-root:///pkg/bin/main.dart: import '../../dep/lib/d.dart' reaches a source its dependencies define under 'package:dep/d.dart'; import that instead."
          if out=$(bazel build //pkg:bad_bin --spawn_strategy=standalone 2>&1); then
            echo "ERROR: local-strategy build should have failed with the import-shape refusal"
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | grep -F -q "reaches a source its dependencies define under 'package:dep/d.dart'; import that instead."
          echo "OK: expected import-shape refusal detected"
      - name: "kernel_dep_shape — the package: shape of the same edges succeeds"
        working-directory: e2e/kernel_dep_shape
        run: |
          bazel build //pkg:good_app || exit 1
          echo "OK: package: import of the dep source compiled"
      # An SDK version outside the pinned toolchain table must fail instead
      # of downloading an SDK release with no recorded checksum.
      - name: sdk_unknown_version — expect an unpinned SDK version to fail resolution
        working-directory: e2e/sdk_unknown_version
        run: |
          if bazel build //:app 2>/dev/null; then
            echo "ERROR: build should have failed with an unknown SDK version error"
            exit 1
          fi
          bazel build //:app 2>&1 | grep -F -q "instead of '9.9.9'"
          echo "OK: expected unknown-SDK-version error detected"
      # `e2e/pub_symlink` exercises the tar header scan
      # (`dart/pub/private/pub_archive_scan.bzl`) over a local file://
      # registry plus a live git remote. The step points the hosted locks'
      # FIXTURES_ROOT placeholder at the fixtures directory and the git
      # lock's placeholder resolved-ref at a scratch remote whose package
      # smuggles a symlink above its root, then expects: the clean hub to
      # stay green, the git fetch to fail on the escaping symlink, and each
      # hostile hosted hub to fail its fetch before extraction with the
      # refusal naming package, entry path, entry kind and raw target (entry
      # paths that escape the root themselves fail with the path diagnostic
      # naming package and path instead). The fixture lock commits the clean
      # hub's planning facts, so these runs exercise planning on the hit path
      # while every hostile spoke still scans its own archive and refuses: no
      # planning verdict ever reaches a spoke, so no lockfile entry can weaken
      # the spoke scan. All locks are restored on exit.
      - name: pub_symlink — header scan stays green on clean packages, refuses hostile entries
        working-directory: e2e/pub_symlink
        run: |
          trap 'git checkout -- pubspec.lock pubspec.ok.lock pubspec.evil_hard_out.lock pubspec.evil_hard_in.lock pubspec.evil_abs.lock pubspec.evil_esc.lock pubspec.evil_path_abs.lock pubspec.evil_path_dotdot.lock' EXIT
          rm -rf /tmp/pub_symlink_evil /tmp/pub_symlink_outside.txt
          mkdir -p /tmp/pub_symlink_evil/evil_pkg/lib
          ( cd /tmp/pub_symlink_evil && git init -q . && git config user.email t@t.t && git config user.name t && printf 'name: evil_pkg\nversion: 1.0.0\nenvironment:\n  sdk: ">=3.0.0 <4.0.0"\n' > evil_pkg/pubspec.yaml && echo 'OUTSIDE-SECRET' > /tmp/pub_symlink_outside.txt && ln -s ../../outside.txt evil_pkg/lib/evil.dart && printf 'String get ok => "ok";\n' > evil_pkg/lib/ok.dart && git add -A && git commit -qm init )
          ref=$(git -C /tmp/pub_symlink_evil rev-parse HEAD)
          sed -i "s/0000000000000000000000000000000000000000/$ref/" pubspec.lock
          fixtures="$PWD/fixtures"
          sed -i "s|file://FIXTURES_ROOT|file://$fixtures|" pubspec.ok.lock pubspec.evil_hard_out.lock pubspec.evil_hard_in.lock pubspec.evil_abs.lock pubspec.evil_esc.lock pubspec.evil_path_abs.lock pubspec.evil_path_dotdot.lock
          bazel build //:ok_app
          echo "OK: clean hosted packages with an in-package symlink stay green"
          grep -E -q 'pub\.scc\.v2\.[0-9a-f]{24}/hosted/ok_clean/' MODULE.bazel.lock
          grep -E -q 'pub\.scc\.v2\.[0-9a-f]{24}/hosted/ok_inlink/' MODULE.bazel.lock
          test "$(grep -c -F 'pub.scc.v1/' MODULE.bazel.lock)" = 0
          echo "OK: planning runs on the committed facts while hostile spokes still refuse"
          if bazel build //:app 2>/dev/null; then
            echo "ERROR: build should have failed on the escaping symlink"
            exit 1
          fi
          bazel build //:app 2>&1 | grep -F -q 'pub package "evil_pkg": symlink "lib/evil.dart" escapes the package'
          echo "OK: expected git symlink-escape error detected"
          if bazel build //:evil_hard_out_app 2>/dev/null; then
            echo "ERROR: build should have failed on the escaping hard-link"
            exit 1
          fi
          bazel build //:evil_hard_out_app 2>&1 | grep -F -q 'pub package "evil_hard_out": hard-link "lib/evil.dart" points at "../../outside.txt"'
          echo "OK: expected hard-link error detected"
          if bazel build //:evil_hard_in_app 2>/dev/null; then
            echo "ERROR: build should have failed on the in-package hard-link"
            exit 1
          fi
          bazel build //:evil_hard_in_app 2>&1 | grep -F -q 'pub package "evil_hard_in": hard-link "lib/evil.dart" points at "lib/ok.dart"'
          echo "OK: expected in-package hard-link error detected"
          if bazel build //:evil_abs_app 2>/dev/null; then
            echo "ERROR: build should have failed on the absolute symlink target"
            exit 1
          fi
          bazel build //:evil_abs_app 2>&1 | grep -F -q 'pub package "evil_abs": symlink "lib/evil.dart" escapes the package (points at "/etc/passwd")'
          echo "OK: expected absolute-symlink error detected"
          if bazel build //:evil_esc_app 2>/dev/null; then
            echo "ERROR: build should have failed on the escaping symlink"
            exit 1
          fi
          bazel build //:evil_esc_app 2>&1 | grep -F -q 'pub package "evil_esc": symlink "lib/evil.dart" escapes the package (points at "../../outside.txt")'
          echo "OK: expected hosted symlink-escape error detected"
          if bazel build //:evil_path_abs_app 2>/dev/null; then
            echo "ERROR: build should have failed on the absolute entry path"
            exit 1
          fi
          bazel build //:evil_path_abs_app 2>&1 | grep -F -q 'pub package "evil_path_abs": entry "/abs.dart" escapes the package'
          echo "OK: expected absolute-path error detected"
          if bazel build //:evil_path_dotdot_app 2>/dev/null; then
            echo "ERROR: build should have failed on the climbing entry path"
            exit 1
          fi
          bazel build //:evil_path_dotdot_app 2>&1 | grep -F -q 'pub package "evil_path_dotdot": entry "../outside.dart" escapes the package'
          echo "OK: expected climbing-path error detected"
      # `e2e/pub_symlink/cycle` is a nested red-by-design workspace: the
      # two packages form a dependency cycle, so planning merges them — but
      # cycle_b_evil's tarball carries a hard-link entry, and the header
      # scan refuses it while the plan fetches the member archives. The step
      # points the lock's FIXTURES_ROOT placeholder at the parent
      # fixtures directory, expects the planning failure, and restores the
      # lock on exit.
      - name: pub_symlink_scc — expect a hostile cycle member to fail planning
        working-directory: e2e/pub_symlink/cycle
        run: |
          trap 'git checkout -- pubspec.cycle.lock' EXIT
          fixtures="$(cd ../fixtures && pwd)"
          sed -i "s|file://FIXTURES_ROOT|file://$fixtures|" pubspec.cycle.lock
          if bazel build //:app 2>/dev/null; then
            echo "ERROR: build should have failed on the hostile cycle member"
            exit 1
          fi
          bazel build //:app 2>&1 | grep -F -q 'pub package "cycle_b_evil": hard-link "lib/evil.dart" points at "../outside.txt"'
          echo "OK: expected cycle hard-link error detected"
      # `e2e/pub_scanner_intruder` pins the scanner's SDK address: the
      # `toolchain_intruder` module tags `dart.toolchain` and is listed ahead
      # of rules_dart, so resolving the SDK by module order would fetch it
      # from a repository that does not exist. The step builds the app (the
      # toolchain works in an intruder graph) and the scanner itself (the
      # scanner repository materializes from the mapping-based SDK address).
      - name: pub_scanner_intruder — scanner SDK resolution survives an intruder module
        working-directory: e2e/pub_scanner_intruder
        run: |
          bazel build //:hello
          echo "OK: toolchain build stays green with an intruder module ahead of rules_dart"
          bazel build @dart_pub_scanner//:scanner
          echo "OK: scanner repository materializes with an intruder module ahead of rules_dart"
      # A link hook that refuses the program's recorded uses fails the build,
      # and its own message reaches the user.
      - name: link_hook — expect a hook's refusal to fail the build, with its message
        working-directory: e2e/link_hook
        run: |
          if bazel build //:dynamic_app_assets 2>/dev/null; then
            echo "ERROR: build should have failed in glyphs' link hook"
            exit 1
          fi
          bazel build //:dynamic_app_assets 2>&1 | grep -q "a Glyph is constructed at run time"
          echo "OK: link hook failure reported"
      # Each target in e2e/analysis_failure is expected red under the
      # `dart_analyze` aspect, which its `.bazelrc` applies under `bazel test`.
      # `check` builds one, expects the build to fail, and greps its output
      # for the one diagnostic only that target produces.
      - name: analysis_failure — expect analyzer diagnostics to fail the build, at workspace paths
        working-directory: e2e/analysis_failure
        run: |
          if bazel test //:bad_lib 2>/dev/null; then
            echo "ERROR: build should have failed with analyzer diagnostics"
            exit 1
          fi
          out=$(bazel test //:bad_lib 2>&1 || true)
          echo "$out" | grep -q "unused_local_variable"
          # Named as the user's file, not as the staged copy under `src/`.
          echo "$out" | grep -q -- "- lib/bad.dart:4:7 -"
          echo "OK: expected analyzer failure detected, at the workspace path"
      - name: analysis_failure — expect a binary's entrypoint to be analyzed too
        working-directory: e2e/analysis_failure
        run: |
          if bazel test //:bad_bin 2>/dev/null; then
            echo "ERROR: build should have failed with analyzer diagnostics"
            exit 1
          fi
          bazel test //:bad_bin 2>&1 | grep -q "unused_import"
          echo "OK: expected analyzer failure detected"
      # A `flutter_library` lists its files in `DefaultInfo` and leaves
      # `DartAnalyzableInfo.srcs` empty; they are its own files all the same.
      - name: analysis_failure — expect a flutter_library-shaped target to be analyzed
        working-directory: e2e/analysis_failure
        run: |
          if bazel test //flutter_shaped 2>/dev/null; then
            echo "ERROR: build should have failed with unused_element"
            exit 1
          fi
          bazel test //flutter_shaped 2>&1 | grep -q "unused_element"
          echo "OK: package-only target analyzed"
      - name: analysis_failure — expect a bundle-shaped target's package sources to be analyzed
        working-directory: e2e/analysis_failure
        run: |
          if bazel test //bundle_shaped 2>/dev/null; then
            echo "ERROR: build should have failed with unused_element"
            exit 1
          fi
          bazel test //bundle_shaped 2>&1 | grep -q "bundle_shaped/lib/bundle.dart.*unused_element"
          echo "OK: package sources analyzed though DefaultInfo is a bundle"
      # Each file is judged by the nearest options file above it, as in the
      # IDE: `nested/lib/quiet.dart` breaks `nested/`'s `avoid_print`, and
      # `nested/lib/loud/loud.dart` prints under nearer options that allow it.
      - name: analysis_failure — expect the nearest options file to govern each file
        working-directory: e2e/analysis_failure
        run: |
          if bazel test //nested 2>/dev/null; then
            echo "ERROR: build should have failed with avoid_print"
            exit 1
          fi
          out=$(bazel test //nested 2>&1 || true)
          echo "$out" | grep -q "nested/lib/quiet.dart:5:3 .* avoid_print"
          if echo "$out" | grep -q "loud.dart"; then
            echo "ERROR: loud.dart was judged by options other than its nearest"
            exit 1
          fi
          echo "OK: nearest options applied per file"
      # An `include:` that does not resolve makes the analyzer apply no rules at
      # all, so without a diagnostic a misconfigured ruleset and a clean
      # codebase look identical. These two steps pin both halves: a broken
      # include is reported, and a working one really does bring its lints to
      # bear. Both are SDK behaviour that nothing else here asserts.
      - name: analysis_failure — expect an unresolvable ruleset include to fail
        working-directory: e2e/analysis_failure
        run: |
          if bazel test //unresolved_ruleset:clean_lib 2>/dev/null; then
            echo "ERROR: build should have failed with an unresolved include"
            exit 1
          fi
          bazel test //unresolved_ruleset:clean_lib 2>&1 | grep -q "include_file_not_found"
          echo "OK: expected unresolved include detected"
      - name: analysis_failure — expect an included ruleset's lints to be applied
        working-directory: e2e/analysis_failure
        run: |
          if bazel test //vga:double_quoted_lib 2>/dev/null; then
            echo "ERROR: build should have failed with a very_good_analysis lint"
            exit 1
          fi
          bazel test //vga:double_quoted_lib 2>&1 | grep -q "prefer_single_quotes"
          echo "OK: included ruleset's lints reached the code"
      # The layout-gated half: `public_member_api_docs` only fires when the
      # nearest-pubspec walk roots the file's package at its true lib_root,
      # which the per-package stub pubspecs staged by `stage_dart_project`
      # provide. If they go missing this build silently turns green.
      - name: analysis_failure — expect package-root-gated lints to be applied
        working-directory: e2e/analysis_failure
        run: |
          if bazel test //vga:undocumented_lib 2>/dev/null; then
            echo "ERROR: build should have failed with public_member_api_docs"
            exit 1
          fi
          bazel test //vga:undocumented_lib 2>&1 | grep -q "public_member_api_docs"
          echo "OK: package-root-gated lint reached the code"
      # A ruleset shared by another Bazel module is included from an options
      # file of this one; the module's own options file cannot govern here.
      - name: analyze_composition — expect another module's ruleset to apply
        working-directory: e2e/analyze_composition
        run: |
          if bazel test //bad 2>/dev/null; then
            echo "ERROR: build should have failed with avoid_print"
            exit 1
          fi
          bazel test //bad 2>&1 | grep -q "avoid_print"
          echo "OK: included ruleset from another module applied"
      - name: analyze_composition — expect another repository's options to be refused
        working-directory: e2e/analyze_composition
        run: |
          if bazel build //:cross_repo_config 2>/dev/null; then
            echo "ERROR: build should have refused an options file from another repository"
            exit 1
          fi
          bazel build //:cross_repo_config 2>&1 | grep -q "is in another repository"
          echo "OK: cross-repository options refused"
      # The format check's red paths, under the aspect's `dart_format` output
      # group. The first is the obvious one; the other two exist because
      # `dart format` treats an unresolvable `include:` as a warning, exits 0,
      # and silently formats at stock defaults — so a broken options file and a
      # correctly formatted codebase look identical unless the runner
      # escalates. These also pin the SDK's warning text, which that escalation
      # matches on. Each target is tagged `no-dart-analyze`, so the format check
      # is the only thing that can fail it.
      - name: analysis_failure — expect a formatting violation to fail
        working-directory: e2e/analysis_failure
        run: |
          if bazel test //fmt 2>/dev/null; then
            echo "ERROR: build should have failed with a formatting violation"
            exit 1
          fi
          bazel test //fmt 2>&1 | grep -q "Changed fmt/lib/misformatted.dart"
          echo "OK: expected formatting failure detected, at the workspace path"
      - name: analysis_failure — expect an unresolvable format ruleset to fail
        working-directory: e2e/analysis_failure
        run: |
          if bazel test //fmt_unresolved 2>/dev/null; then
            echo "ERROR: build should have failed with an unresolved include"
            exit 1
          fi
          bazel test //fmt_unresolved 2>&1 | grep -q "Failed to resolve package URI"
          echo "OK: silently-degraded format options rejected"
      # A relative `include:` of a yaml no target declares. The file exists in
      # the workspace, so a check that read outside its staged project — as an
      # unsandboxed action could — would go green or fail differently. Both
      # checks must fail on the unreadable include, naming it at its workspace
      # path, under the sandbox and without one alike.
      - name: analysis_failure — expect an undeclared relative include to fail both checks
        working-directory: e2e/analysis_failure
        run: |
          for strategy in "" "--spawn_strategy=standalone"; do
            for group in dart_analyze dart_format; do
              args=()
              [ -n "$strategy" ] && args+=("$strategy")
              args+=("--output_groups=-dart_analyze,-dart_format,+$group")
              if bazel test "${args[@]}" //undeclared_include 2>/dev/null; then
                echo "ERROR: $group [$strategy] should have failed on the undeclared include"
                exit 1
              fi
              out=$(bazel test "${args[@]}" //undeclared_include 2>&1 || true)
              case $group in
                dart_analyze) echo "$out" | grep -q "The URI 'shared.yaml' included in 'undeclared_include/analysis_options.yaml' can't be found" ;;
                dart_format) echo "$out" | grep -q "Couldn't read file \"undeclared_include/shared.yaml\"" ;;
              esac
            done
          done
          echo "OK: undeclared include refused by both checks, under every strategy"
      # The format check runs only when its output group is asked for: with
      # `dart_format` removed from the groups `.bazelrc` requests, the
      # misformatted target builds green.
      - name: analysis_failure — expect the format check to run only when requested
        working-directory: e2e/analysis_failure
        run: |
          bazel test --output_groups=-dart_format //fmt || [ $? -eq 4 ]
          echo "OK: format check skipped when its output group is not requested"
      # A `manual` target is out of `//...`'s reach; `dart_analysis_test` names
      # it and must fail to build on its violation, whatever output groups the
      # command line asks for.
      - name: analysis_failure — expect dart_analysis_test to fail on a manual target's violation
        working-directory: e2e/analysis_failure
        run: |
          flags="--output_groups=-dart_analyze,-dart_format"
          if bazel test $flags //manual:manual_analysis_test 2>/dev/null; then
            echo "ERROR: build should have failed with dead_code"
            exit 1
          fi
          bazel test $flags //manual:manual_analysis_test 2>&1 | grep -q "manual/lib/manual_bad.dart:4:3 - Dead code"
          echo "OK: dart_analysis_test checked the manual target"
      # A hung test is diagnosed from what it printed before Bazel killed it, so
      # that output has to be in test.log rather than held back by the launcher.
      - name: dart_test — expect a timed-out test's output in its log
        working-directory: e2e/dart_test
        run: |
          if bazel test --test_timeout=5 //:hangs_until_killed_test; then
            echo "ERROR: test should have timed out"
            exit 1
          fi
          log=bazel-testlogs/hangs_until_killed_test/test.log
          grep -q "Test timed out" "$log"
          grep -q "printed before hanging" "$log"
          grep -q "written to stderr before hanging" "$log"
          echo "OK: timed-out test's output reached its log"
  # `dart compile kernel` rejects `--enable-asserts`, so dbg-mode flags are
  # chosen per compile mode. hello_world builds all four dart_binary modes;
  # dart_test exercises the kernel test path end-to-end.
  dbg-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: hello_world — build all compile modes under -c dbg
        working-directory: e2e/hello_world
        run: bazel build -c dbg //...
      - name: dart_test — run tests under -c dbg
        working-directory: e2e/dart_test
        run: bazel test -c dbg --test_output=errors //...
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: j178/prek-action@v3.0.1
        with:
          # Keep in step with prek in multitool.lock.json
          prek-version: 0.5.5
  # For branch protection settings, this job provides a "stable" name that can be used to gate PR merges
  # on "all matrix jobs were successful".
  conclusion:
    needs:
      - test
      - mac-smoke
      - format-hermeticity
      - expected-failure
      - dbg-mode
      - pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
