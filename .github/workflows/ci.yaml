name: CI
# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main, "ci/**"]
    # Tag pushes run the whole workflow UNCACHED (see the cache inputs
    # below): the release gate (release.yaml) requires passing tag-push runs
    # of this workflow and of full.yaml on the tagged commit.
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Nightly run to catch upstream breakage (new Dart SDK, Bazel, deps).
  # A `schedule` run never restores or saves any Bazel cache (see the
  # `schedule` branches on every cache input below), so this is the cold,
  # uncached run: every test job re-executes instead of replaying the disk
  # cache. Tag pushes (`v*`) run the same cold shape minus the disk/external
  # restore (see below); branch and PR pushes stay cached.
  schedule:
    - cron: "0 9 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      uncached:
        description: Run every test job without restoring or saving any Bazel cache
        required: false
        default: false
        type: boolean
concurrency:
  # Cancel previous actions from the same PR or branch except 'main' branch.
  # See https://docs.github.com/en/actions/using-jobs/using-concurrency and https://docs.github.com/en/actions/learn-github-actions/contexts for more info.
  group: concurrency-group::${{ github.workflow }}::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}${{ github.ref_name == 'main' && format('::{0}', github.run_id) || ''}}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
jobs:
  # The e2e workspaces (plus `.`, `dev`, `tools` and `.github/workflows`) used
  # to run as one CI job per (OS, folder): ~90 jobs whose macOS third queued
  # behind the account's 5 shared macOS slots. Linux and Windows now run as 6
  # shard jobs sharing one Bazel disk cache per shard: one cache restore and
  # one Bazelisk install per job instead of one per folder. Push CI runs a
  # single macOS smoke job (`mac-smoke`); the full per-folder macOS coverage
  # runs in the `full.yaml` pre-release workflow. Every folder still runs
  # `bazel test //...` with the same flags on every OS it ran on before (exit
  # code 4 still means "no test targets"). Folders in a shard run a few at a
  # time (`parallelism` waves); each folder's full log is streamed under a
  # `===== <folder> =====` header the moment that folder finishes (not after
  # all waves), and uploaded as an artifact `if: always()`, so a killed job
  # still leaves its evidence and the executed-test counts stay auditable.
  # Each folder runs under its own Bazel server (`--output_base`): the folders
  # of a shard otherwise share the output base setup-bazel pins, so concurrent
  # folders kill each other's servers and flake with exit 1.
  # The per-shard `cache` name keys the shared disk cache; the repository,
  # external and bazelisk caches keep their shared keys.
  # Coverage map: every directory under e2e/ with a MODULE.bazel is built and
  # tested by some job in this workflow. Green workspaces run
  # `bazel test //...` in the `test` shards above (and in `full.yaml` on
  # macOS): every e2e/ folder a shard lists. Red-by-design workspaces run in
  # `expected-failure` below: e2e/pub_lock_conflict, e2e/pub_lock_unpinned,
  # e2e/pub_package_unpinned, e2e/pub_spoke_blank_sha,
  # e2e/pub_spoke_malformed_sha, e2e/pub_git_unpinned_ref,
  # e2e/pub_scc_unpinned_member, e2e/sdk_unknown_version, e2e/pub_symlink
  # (plus its nested red-by-design `cycle` workspace), e2e/kernel_dep_shape.
  # e2e/pub_scanner_intruder is green but needs its scanner built explicitly,
  # so it runs in a step there too.
  # e2e/pub_fetch_powershell runs in the shard-3-only steps below;
  # e2e/analysis_failure and e2e/analyze_composition also run in
  # `expected-failure` and `format-hermeticity`, and e2e/dart_test also in
  # `dbg-mode` and `expected-failure`. No e2e workspace is left without a job.
  # A tag push runs every job, matrix entry and step below, uncached: no job
  # skips work on a tag push that the nightly `schedule` run does.
  test:
    name: test (${{ matrix.os }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    # A hung folder fails fast instead of burning the runner for hours.
    # Healthy shards finish well inside this; cold tag-push and nightly runs
    # need the headroom. GitHub caps jobs at 6 h.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: 1
            parallelism: 3
            cache: test-linux-1
            folders: |
              .
              e2e/fix
              e2e/link_hook
              e2e/codegen
              e2e/analyze_composition
              e2e/cross_compile
              tools
              e2e/pub_deps
          - os: ubuntu-latest
            shard: 2
            parallelism: 3
            cache: test-linux-2
            folders: |
              e2e/pub_lock_upgrade
              dev
              .github/workflows
              e2e/pub_lock_scc
              e2e/pub_lock
              e2e/dart_test_pkg
              e2e/hello_world
              e2e/dual_build
              e2e/isolated_hub
              e2e/analysis
          - os: ubuntu-latest
            shard: 3
            parallelism: 3
            cache: test-linux-3
            folders: |
              e2e/ext_exemplar
              e2e/web_app
              e2e/gazelle
              e2e/smoke
              e2e/library_deps
              e2e/dart_test
              e2e/pub_lock_git
              e2e/pub_lock_cross_module
              e2e/pub_lock_dedup
              e2e/guard_reuse
              e2e/root_sdk_pin
              e2e/sdk_coupling
          - os: windows-latest
            shard: 1
            parallelism: 3
            cache: test-windows-1
            # The root workspace alone: with other folders running beside it
            # on the same runner its 19k actions take 3x longer, which sets
            # the whole run's wall time. Alone it only competes with itself.
            folders: |
              .
          - os: windows-latest
            shard: 2
            parallelism: 3
            cache: test-windows-2
            # e2e/link_hook alone, for the same reason as the root workspace.
            folders: |
              e2e/link_hook
          - os: windows-latest
            shard: 3
            parallelism: 3
            cache: test-windows-3
            folders: |
              e2e/ext_exemplar
              e2e/web_app
              e2e/gazelle
              e2e/smoke
              e2e/library_deps
              e2e/dart_test
              e2e/pub_lock_git
              e2e/pub_lock_cross_module
              e2e/pub_lock_dedup
              e2e/guard_reuse
              e2e/root_sdk_pin
              e2e/sdk_coupling
          - os: windows-latest
            shard: 4
            parallelism: 3
            cache: test-windows-4
            folders: |
              e2e/fix
              e2e/codegen
              e2e/analyze_composition
              e2e/cross_compile
              tools
              e2e/pub_deps
              e2e/pub_lock_upgrade
              dev
          - os: windows-latest
            shard: 5
            parallelism: 3
            cache: test-windows-5
            folders: |
              .github/workflows
              e2e/pub_lock_scc
              e2e/pub_lock
              e2e/dart_test_pkg
              e2e/hello_world
              e2e/dual_build
              e2e/isolated_hub
              e2e/analysis
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          # Branch and PR pushes restore and save every cache below. Tag
          # pushes (`github.ref_type == 'tag'`), `schedule` runs and
          # `uncached` dispatches restore neither the Bazel disk cache nor
          # the external cache and save nothing, so every test really
          # executes instead of replaying the disk cache. The
          # content-addressed repository cache and the bazelisk cache still
          # restore (every fetch is sha256-pinned).
          disk-cache: ${{ github.event_name != 'schedule' && github.ref_type != 'tag' && !inputs.uncached && matrix.cache || false }}
          external-cache: ${{ github.event_name != 'schedule' && github.ref_type != 'tag' && !inputs.uncached }}
          repository-cache: ${{ github.event_name != 'schedule' && !inputs.uncached }}
          cache-save: ${{ github.event_name != 'schedule' && github.ref_type != 'tag' && !inputs.uncached }}
          # Rotates every cache key below (disk, repository, external,
          # bazelisk). setup-bazel skips the post-job save for any cache whose
          # key restored with an exact hit, so a key saved by a failed or
          # partial run stays stale forever and every later run misses against
          # it. Bump this after a sharding change or a poisoned key; the next
          # run is cold once, then its post-job saves write complete entries.
          cache-version: "3"
          bazelrc: |
            common --announce_rc
            common --color=yes
            common --enable_bzlmod=true
            # Memory bounds: a shard runs PARALLELISM=3 folders at once (see
            # the Test step). By default every server grows its JVM heap to
            # ~1/4 of host RAM and schedules actions as if it owned the whole
            # machine, so concurrent cold servers exhaust a 4-CPU/16 GB runner
            # and the job dies on a shutdown signal (exit 143). Per server:
            # heap 2 GB (3 x 2 = 6 GB, was ~3 x 4 = 12 GB), 1 CPU (3 of 4
            # cores), scheduled RAM 15% of host RAM (3 x 15% = 45%, ~7.2 GB of
            # 16 GB): heaps plus scheduled actions stay near ~13 GB, leaving
            # room for the OS, the Bazel clients and JVM off-heap.
            # HOST-relative so smaller runners (macOS) scale the same
            # fractions. Scheduling limits only: action keys are unchanged, so
            # cache warmth is unaffected.
            startup --host_jvm_args=-Xmx2g
            build --local_resources=cpu=1
            build --local_resources=memory=HOST_RAM*.15
      - name: Test
        env:
          FOLDERS: ${{ matrix.folders }}
          PARALLELISM: ${{ matrix.parallelism }}
        # Explicit bash: the default shell is PowerShell on Windows, where the
        # wave below is not valid. The per-folder command keeps the old
        # `bash -c '... || [ $? -eq 4 ]'`, so Windows still runs it under bash.
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE//\\//}"
          # Per-folder logs live under RUNNER_TEMP so the upload step below can
          # ship them even when this step fails or the job is killed. Each
          # folder's log is printed under a `===== <folder> =====` header the
          # moment that folder finishes (not after all waves), so a killed job
          # still leaves the completed folders' evidence and the
          # executed-test counts stay auditable.
          logdir="${RUNNER_TEMP}/shard-logs"
          rm -rf "$logdir"
          mkdir -p "$logdir"
          # One Bazel server per folder (see run_one below). Native path: the
          # Windows bazel.exe does not understand msys /tmp spellings.
          outbasedir="${RUNNER_TEMP}/bazel-servers"
          # Pin the Bazel version in every folder of this shard, as the old
          # per-folder Configure step did.
          while IFS= read -r folder; do
            [ -z "$folder" ] && continue
            echo "9.3.0" > "$ws/$folder/.bazelversion"
          done <<< "$FOLDERS"
          run_one() {
            slug="$(printf '%s' "$1" | tr '/.' '_')"
            # Same test command and flags as the old per-folder Test step, plus
            # a per-folder --output_base so the folder gets its own Bazel
            # server. The disk and repository caches stay shared, so warmth is
            # unaffected.
            # Exit code 4 means "build succeeded but no test targets found".
            if ( cd "$ws/$1" && bazel --output_base="$outbasedir/$slug" test --test_output=errors //... || [ $? -eq 4 ] ) >"$logdir/$slug.log" 2>&1; then
              echo 0 >"$logdir/$slug.status"
            else
              echo 1 >"$logdir/$slug.status"
            fi
          }
          # Windows runners fail when the first Bazel servers start at once:
          # they race creating the shared base directory (error 183). Each
          # folder has its own server directory now, but still start them
          # serially here; the waves below then attach to running servers.
          if [ "$RUNNER_OS" = "Windows" ]; then
            while IFS= read -r folder; do
              [ -z "$folder" ] && continue
              slug="$(printf '%s' "$folder" | tr '/.' '_')"
              ( cd "$ws/$folder" && bazel --output_base="$outbasedir/$slug" version ) >/dev/null 2>&1 || true
            done <<< "$FOLDERS"
          fi
          running=0
          # Folders already printed by print_done below.
          printed=""
          # Print the log of every finished folder not printed yet.
          print_done() {
            while IFS= read -r folder; do
              [ -z "$folder" ] && continue
              slug="$(printf '%s' "$folder" | tr '/.' '_')"
              case " $printed " in
                *" $slug "*) continue ;;
              esac
              if [ -f "$logdir/$slug.status" ]; then
                echo "===== $folder (exit $(cat "$logdir/$slug.status")) ====="
                cat "$logdir/$slug.log"
                printed="$printed $slug "
              fi
            done <<< "$FOLDERS"
          }
          # Block until at least one more folder finishes, then stream the
          # newly finished logs. Polling (not `wait -n`) so this also runs
          # under macOS bash 3.2, which full.yaml shares.
          wait_one() {
            before=0
            for s in "$logdir"/*.status; do
              [ -f "$s" ] || continue
              before=$((before + 1))
            done
            while true; do
              print_done
              have=0
              for s in "$logdir"/*.status; do
                [ -f "$s" ] || continue
                have=$((have + 1))
              done
              [ "$have" -gt "$before" ] && return 0
              sleep 10
            done
          }
          while IFS= read -r folder; do
            [ -z "$folder" ] && continue
            run_one "$folder" &
            running=$((running + 1))
            if [ "$running" -ge "$PARALLELISM" ]; then
              wait_one
              running=$((running - 1))
            fi
          done <<< "$FOLDERS"
          wait
          print_done
          fail=0
          while IFS= read -r folder; do
            [ -z "$folder" ] && continue
            slug="$(printf '%s' "$folder" | tr '/.' '_')"
            [ "$(cat "$logdir/$slug.status")" = 0 ] || fail=1
          done <<< "$FOLDERS"
          exit "$fail"
      # Ship the per-folder logs even when the Test step fails or the job is
      # killed, so a dead shard still leaves its evidence for diagnosis.
      - name: Upload shard logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shard-logs-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-logs
          if-no-files-found: warn
      # The pub symlink guard (`dart/pub/private/pub_symlink.bzl`) must not
      # depend on host tools or PATH. Every step above runs Bazel under bash
      # (see the Test step's `shell: bash`), where Git Bash's GNU
      # find/readlink/cp/rm/mv come first on PATH and mask such a
      # dependency — rules_flutter main caught it instead, with Windows
      # resolving `find` to FIND.EXE. This step fetches and builds a
      # workspace holding one hosted and one git pub package from
      # PowerShell, with a fresh output base so the fetch really runs under
      # PowerShell's PATH. It shares shard 3's runner and disk cache, so it
      # fits the existing shard time.
      - name: PowerShell pub fetch (no host tools)
        if: matrix.os == 'windows-latest' && matrix.shard == 3
        working-directory: e2e/pub_fetch_powershell
        shell: powershell
        run: |
          [System.IO.File]::WriteAllText(".bazelversion", "9.3.0`n")
          bazel --output_base="$env:RUNNER_TEMP/bazel-pwsh" build //...
          bazel --output_base="$env:RUNNER_TEMP/bazel-pwsh" run //:app
      # Same guard, other direction: shadow find/readlink/cp/rm/mv with
      # shims that fail loudly, fetch the mixed hosted+git workspace twice
      # (normal vs stubbed PATH, fresh output bases so both really fetch),
      # and diff the fetched package trees: they must be identical, with no
      # symlinks left behind. Shares shard 3's runner and disk cache.
      - name: Restricted-PATH pub fetch equality
        if: matrix.os == 'ubuntu-latest' && matrix.shard == 3
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE}"
          shims="$(mktemp -d)"
          for tool in find readlink cp rm mv; do
            printf '#!/bin/sh\necho "blocked: %s must not be used" >&2\nexit 99\n' "$tool" > "$shims/$tool"
            chmod +x "$shims/$tool"
          done
          echo "9.3.0" > "$ws/e2e/pub_fetch_powershell/.bazelversion"
          ( cd "$ws/e2e/pub_fetch_powershell" && bazel --output_base="$RUNNER_TEMP/bazel-pw-normal" build //... )
          ( cd "$ws/e2e/pub_fetch_powershell" && bazel --output_base="$RUNNER_TEMP/bazel-pw-stubbed" build --repo_env=PATH="$shims:/usr/local/bin:/usr/bin:/bin" //... )
          for repo in "ai_rules_dart++pub+dart_pub__characters" "ai_rules_dart++pub+dart_pub__meta" "ai_rules_dart++pub+pub_deps"; do
            diff -r "$RUNNER_TEMP/bazel-pw-normal/external/$repo" "$RUNNER_TEMP/bazel-pw-stubbed/external/$repo"
          done
          test -z "$(find "$RUNNER_TEMP/bazel-pw-stubbed/external/ai_rules_dart++pub+dart_pub__characters" "$RUNNER_TEMP/bazel-pw-stubbed/external/ai_rules_dart++pub+dart_pub__meta" -type l)"
      # Guards Mivr/rules_dart#1: a minimal consuming module must be able to
      # enumerate the whole published module. Dev-only tooling lives in nested
      # modules excluded via REPO.bazel `ignore_directories`, so no package under
      # @rules_dart//... may load a dev-only repository. `e2e/smoke` is that
      # minimal consumer (local_path_override to the repo root). It runs here,
      # once per OS, instead of in its own job.
      - name: Consumer query
        if: matrix.shard == 1
        working-directory: e2e/smoke
        run: |
          echo "9.3.0" > .bazelversion
          bazel query "@rules_dart//..."
  # Push CI's only macOS job: a fast smoke test that always runs cold (no
  # cache restore or save), so it executes real compile actions under the
  # darwin sandbox on every run instead of replaying the disk cache. The
  # macOS-specific risks are toolchain/SDK resolution for macOS-arm64 and
  # action execution under the darwin sandbox; `e2e/hello_world` exercises
  # both by building all four `dart_binary` compile modes and running the
  # binary, whose output is asserted: unlike the old
  # `bazel test //... || [ $? -eq 4 ]`, this cannot pass while executing
  # 0 actions on a "no tests found" no-op. The consumer query keeps the
  # Mivr/rules_dart#1 module-enumeration guard on macOS. Full per-folder
  # macOS coverage runs in the `full.yaml` pre-release workflow, which
  # releases require.
  mac-smoke:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          # Always cold: this job's whole point is executing real macOS
          # actions, so it neither restores nor saves any Bazel cache.
          disk-cache: false
          external-cache: false
          repository-cache: false
          cache-save: false
          bazelrc: |
            common --announce_rc
            common --color=yes
            common --enable_bzlmod=true
            # Memory bounds: a shard runs PARALLELISM=3 folders at once (see
            # the Test step). By default every server grows its JVM heap to
            # ~1/4 of host RAM and schedules actions as if it owned the whole
            # machine, so concurrent cold servers exhaust a 4-CPU/16 GB runner
            # and the job dies on a shutdown signal (exit 143). Per server:
            # heap 2 GB (3 x 2 = 6 GB, was ~3 x 4 = 12 GB), 1 CPU (3 of 4
            # cores), scheduled RAM 15% of host RAM (3 x 15% = 45%, ~7.2 GB of
            # 16 GB): heaps plus scheduled actions stay near ~13 GB, leaving
            # room for the OS, the Bazel clients and JVM off-heap.
            # HOST-relative so smaller runners (macOS) scale the same
            # fractions. Scheduling limits only: action keys are unchanged, so
            # cache warmth is unaffected.
            startup --host_jvm_args=-Xmx2g
            build --local_resources=cpu=1
            build --local_resources=memory=HOST_RAM*.15
      - name: Configure Bazel version
        working-directory: e2e/hello_world
        run: |
          echo "9.3.0" > .bazelversion
          bazel version
      # `bazel build` executes the real compile actions for all four compile
      # modes under the darwin sandbox; `bazel run` executes the result. The
      # output assertion means this fails unless something really ran.
      - name: Build hello_world
        working-directory: e2e/hello_world
        run: bazel build //...
      - name: Run hello_world
        working-directory: e2e/hello_world
        run: |
          out="$(bazel run //:hello 2>&1)"
          echo "$out"
          echo "$out" | grep -q "Hello, World!"
      - name: Consumer query
        working-directory: e2e/smoke
        run: |
          echo "9.3.0" > .bazelversion
          bazel query "@rules_dart//..."
  # `dart format` and `dart analyze` find their configuration by walking up from
  # the file they are given, and that walk does not stop at the project root. It
  # used to escape: under a sandbox it found nothing (so a repo's configured
  # page width was silently ignored), and unsandboxed it climbed into the
  # execroot — or, in manifest runfiles mode, ran against the source tree
  # outright. Which of those happened decided the verdict, so the same code
  # passed or failed depending on the flags.
  #
  # The `dart_analyze` aspect's staged project bounds the walk, and
  # `e2e/analysis_failure`'s root analysis_options.yaml — deliberately left out
  # of its `analysis_config` — carries an absurd `page_width: 20` canary so this
  # job can prove it: `//:clean_lib` there is formatted at the stock 80, so if
  # the walk ever escapes it reaches the canary and turns red. `e2e/analysis`
  # runs its whole suite beside it, so its configured widths, `package:`
  # includes and language versions must agree across all four cells too.
  format-hermeticity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: forest runfiles, sandboxed
            flags: ""
          - name: forest runfiles, local
            flags: "--spawn_strategy=standalone"
          - name: manifest runfiles, sandboxed
            flags: "--noenable_runfiles"
          - name: manifest runfiles, local
            flags: "--noenable_runfiles --spawn_strategy=standalone"
    steps:
      - uses: actions/checkout@v7
      - name: analysis — ${{ matrix.name }}
        working-directory: e2e/analysis
        # Exit code 4: the workspace has no test targets, only the aspect's
        # checks, which `bazel test` builds.
        run: bazel test ${{ matrix.flags }} --test_output=errors //... || [ $? -eq 4 ]
      - name: analysis_failure canary — ${{ matrix.name }}
        working-directory: e2e/analysis_failure
        run: bazel test ${{ matrix.flags }} //:clean_lib || [ $? -eq 4 ]
  # Workspaces that are expected to fail at module resolution.
  # Validates that rules_dart produces the correct error messages.
  expected-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: pub_lock_conflict — expect version conflict error
        working-directory: e2e/pub_lock_conflict
        run: |
          if bazel build //:app 2>/dev/null; then
            echo "ERROR: build should have failed with a version conflict"
            exit 1
          fi
          bazel build //:app 2>&1 | grep -q "conflicting versions across lock files"
          echo "OK: expected conflict error detected"
      # A hosted lock entry without a sha256 fails module resolution: the
      # extension reports both the lock-level error and the spoke-level one.
      - name: pub_lock_unpinned — expect a missing sha256 to fail resolution
        working-directory: e2e/pub_lock_unpinned
        run: |
          if bazel build //:app 2>/dev/null; then
            echo "ERROR: build should have failed with a missing sha256 error"
            exit 1
          fi
          bazel build //:app 2>&1 | grep -F -q 'pub package "collection" 1.18.0 in @@//:pubspec.lock has no sha256.'
          bazel build //:app 2>&1 | grep -F -q 'pub_lock_package "collection" (1.18.0) requires a non-empty sha256.'
          echo "OK: expected missing-checksum error detected"
      # One step per remaining pub/SDK fetch path. Each red workspace below
      # instantiates a single fetch rule with unpinned coordinates through a
      # test extension, so the failure carries that fetch site's own message:
      # deleting the site's check turns its step red instead of surfacing a
      # neighbouring site's message. Each fails before any download, so the
      # steps stay cheap.
      - name: pub_package_unpinned — expect an explicit package without sha256 to fail its fetch
        working-directory: e2e/pub_package_unpinned
        run: |
          if bazel build @bad_package//... 2>/dev/null; then
            echo "ERROR: build should have failed with a missing sha256 error"
            exit 1
