schema: mivr-e2e-spec/1
commands:
  - name: test
    run: bazel test --test_output=errors //...
    min_tests_executed: 1
  - name: expect a hook's refusal to fail the build
    run: bazel build //:dynamic_app_assets
    expect:
      non_zero: true
      output_contains: "a Glyph is constructed at run time"
