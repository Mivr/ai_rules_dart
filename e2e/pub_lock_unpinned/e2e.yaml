schema: mivr-e2e-spec/1
commands:
  - name: expect a missing sha256 to fail resolution
    run: bazel build //:app
    expect:
      non_zero: true
      stderr_contains: 'pub package "collection" 1.18.0 in @@//:pubspec.lock has no sha256.'
      output_contains: 'pub_lock_package "collection" (1.18.0) requires a non-empty sha256.'
