# Local-registry lock for the spoke-facts e2e: `spoke_a` depends on
# `spoke_b`, while `spoke_b`, `spoke_c`, and `spoke_d` have no dependencies.
# The committed MODULE.bazel.lock wrongs the recorded facts for `spoke_a`
# (dropped edge) and `spoke_d` (fake edge); see MODULE.bazel. The fixtures
# live in e2e/pub_lock_scc/fixtures/ (served over file://; the url's
# FIXTURES_ROOT placeholder is rewritten to the absolute path before
# building, and restored afterwards).
packages:
  spoke_a:
    dependency: "direct main"
    description:
      name: spoke_a
      sha256: "26a4cd7fe1698e652cc0b66e2fd99df428243065e2e2da2a843005e3daf5b61a"
      url: "file://FIXTURES_ROOT"
    source: hosted
    version: "1.0.0"
  spoke_b:
