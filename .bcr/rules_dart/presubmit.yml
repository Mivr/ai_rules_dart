# The test module is e2e/smoke of the release archive (the module's directory,
# `rules_dart-v<version>.tar.gz`), so everything it names is in the archive. Run by
# hand on Linux with Bazel 9.3.0 against the archives of a rehearsal release
# (see RELEASING.md at the repository root); the other platforms and Bazel
# versions of the matrix have not been run.
bcr_test_module:
  module_path: "e2e/smoke"
  matrix:
    platform: ["debian11", "macos", "ubuntu2204", "windows"]
    bazel: ["9.0.0", "9.x", "rolling"]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
